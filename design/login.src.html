<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Lost Persons</title>
<style>
  /* Same token set as the EDC map sign-in, so the two tools feel like one family. */
  .screen {
    --bg: #ffffff; --ink: #111113; --ink2: #6e6e76; --ink3: #a0a0a8; --line: #e2e2e5; --field: #ffffff;
    --sel: #f6f6f7; --btn: #111113; --btn-ink: #ffffff; --off: #f0f0f2; --off-ink: #a0a0a8; --bad: #d93036;
    background: var(--bg); color: var(--ink); box-sizing: border-box;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    display: grid; place-items: center;
  }
  .screen.dark {
    --bg: #0c0c0d; --ink: #f2f2f3; --ink2: #8e8e96; --ink3: #5c5c64; --line: #2b2b30; --field: #121214;
    --sel: #18181b; --btn: #f2f2f3; --btn-ink: #0c0c0d; --off: #1c1c1f; --off-ink: #5c5c64; --bad: #ff5c62;
  }
  .screen.dark .logo { filter: invert(1); }
  .screen *, .screen *::before, .screen *::after { box-sizing: border-box; }
  .col { width: 100%; max-width: 320px; }
  .view[hidden], [hidden] { display: none !important; }

  .logo { display: block; height: 44px; width: auto; margin: 0 auto 28px; }
  h1 { margin: 0; text-align: center; font-size: 19px; line-height: 1.3; font-weight: 600; letter-spacing: -.012em; }
  form { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }

  .input {
    width: 100%; height: 44px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--field); color: var(--ink); outline: 0; -webkit-appearance: none; appearance: none;
    font-family: inherit; font-weight: 400; font-size: 16px; line-height: 1;
  }
  .input::placeholder { color: var(--ink3); }
  .input:focus { border-color: var(--ink2); }
  .err .input { border-color: var(--bad); }

  /* team picker: one grouped list, check on the chosen row */
  .label { font-size: 13px; color: var(--ink2); margin: 2px 0 -6px 1px; }
  .list { border: 1px solid var(--line); border-radius: 8px; background: var(--field); overflow: hidden; }
  .opt { position: relative; display: flex; align-items: center; height: 44px; padding: 0 13px; cursor: pointer; user-select: none; }
  .opt + .opt, .other-row { border-top: 1px solid var(--line); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt span { flex: 1; }
  .opt svg { width: 18px; height: 18px; opacity: 0; transition: opacity .12s; }
  .opt.on { background: var(--sel); font-weight: 500; }
  .opt.on svg { opacity: 1; }
  .opt:focus-within { box-shadow: inset 0 0 0 1.5px var(--ink2); }
  .other-row input {
    width: 100%; height: 44px; padding: 0 13px 0 13px; border: 0; outline: 0; background: transparent;
    color: var(--ink); font-family: inherit; font-weight: 400; font-size: 16px; line-height: 1;
  }
  .other-row input::placeholder { color: var(--ink3); }

  /* who you are, carried onto the password step (WorkOS shows the email here) */
  .who-wrap { display: flex; justify-content: center; margin-top: 14px; }
  .who {
    display: inline-flex; align-items: center; gap: 8px; max-width: 100%; height: 36px; padding: 0 12px 0 6px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--field); color: var(--ink);
    font-family: inherit; font-weight: 400; font-size: 14px; line-height: 1; cursor: pointer;
  }
  .who:active { background: var(--sel); }
  .av {
    flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--off); color: var(--ink);
    display: grid; place-items: center; font-size: 10.5px; font-weight: 600; letter-spacing: .03em;
  }
  .who .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .t i { font-style: normal; color: var(--ink2); }
  .who svg { flex: none; width: 14px; height: 14px; color: var(--ink2); }

  .pw { position: relative; }
  .pw .input { padding-right: 46px; }
  .eye {
    position: absolute; top: 0; right: 0; width: 46px; height: 44px; border: 0; background: none; padding: 0;
    color: var(--ink3); display: grid; place-items: center; cursor: pointer;
  }
  .eye[aria-pressed="true"] { color: var(--ink2); }
  .eye svg { width: 19px; height: 19px; }

  .btn {
    width: 100%; height: 44px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--btn); color: var(--btn-ink); font-family: inherit; font-weight: 500; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:active { opacity: .85; }
  .btn:disabled { background: var(--off); color: var(--off-ink); cursor: default; }
  .btn.busy { background: var(--btn); color: var(--btn-ink); }
  .btn svg { width: 18px; height: 18px; }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: r .7s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }

  .msg { margin-top: -2px; color: var(--bad); font-size: 13.5px; }
  .msg:empty { display: none; }
  .shake { animation: shake .32s ease-in-out; }
  @keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

  .done { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .ok { width: 52px; height: 52px; border-radius: 50%; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; }
  .ok svg { width: 24px; height: 24px; }
  .link { border: 0; background: none; padding: 8px 0; color: var(--ink2); font-family: inherit; font-weight: 400; font-size: 14px; line-height: 1; cursor: pointer; }

  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* ---- presentation only ---- */
  body[data-mode="app"] { margin: 0; background: #0c0c0d; }
  body[data-mode="app"] .screen { padding: calc(24px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom)); }
  @media (prefers-color-scheme: light) { body[data-mode="app"] { background: #fff; } }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px 16px; }
  .board figure { margin: 0; }
  .frame { height: 600px; border-radius: 30px; overflow: hidden; border: 1px solid var(--border, #2b2b30); }
  .frame .screen { height: 100%; padding: 24px 20px; }
  .board figcaption { margin-top: 8px; text-align: center; font: 12px/1.3 var(--font-sans, system-ui); color: var(--muted-foreground, #8e8e96); }
</style>
</head>
<body data-mode="{{MODE}}">
<img id="logo-src" src="{{LOGO}}" alt="" hidden>
{{BODY}}
<script>
(() => {
  const LOGO = document.getElementById('logo-src').src;
  const TEAMS = [
    { v: 'GC/HX - Dispatch', l: 'Dispatch' },
    { v: 'GC/HX - Special Operations/Med Transpo', l: 'Special Ops · Med Transpo' },
    { v: 'GC/HX - Base', l: 'Base' },
    { v: 'Prevent', l: 'Prevent' },
    { v: 'Other', l: 'Other' },
  ];
  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.6A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.9 3.7M6.6 6.6C3.9 8.4 2.5 12 2.5 12S6 18.5 12 18.5c1.9 0 3.5-.6 4.9-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>',
  };
  const APP = document.body.dataset.mode === 'app';
  const PROFILE_KEY = 'lp_profile';
  // Prototype only: the real check is server-side against the bcrypt hash.
  const DEMO_PASSWORD = 'edc';

  const label = (v) => (TEAMS.find((t) => t.v === v) || {}).l || v;
  const initials = (name) => {
    const w = name.trim().split(/\s+/).filter(Boolean);
    if (!w.length) return '';
    return (w.length === 1 ? w[0].slice(0, 2) : w[0][0] + w[w.length - 1][0]).toUpperCase();
  };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let uid = 0;
  function mount(root, preset) {
    const id = ++uid;
    root.innerHTML = `
      <div class="col">
        <img class="logo" src="${LOGO}" alt="EDC Orlando" height="44">

        <section class="view v-who">
          <h1>Sign in to Lost Persons</h1>
          <form class="f-who" novalidate>
            <input class="input name" type="text" placeholder="Your name" aria-label="Your name"
              autocomplete="name" autocapitalize="words" enterkeyhint="next" maxlength="60">
            <div class="label" id="tl-${id}">Team</div>
            <div class="list" role="radiogroup" aria-labelledby="tl-${id}">
              ${TEAMS.map((t) => `<label class="opt"><input type="radio" name="team-${id}" value="${esc(t.v)}"><span>${t.l}</span>${ICON.check}</label>`).join('')}
              <div class="other-row" hidden>
                <input class="other" type="text" placeholder="Team name" aria-label="Your team name" autocapitalize="words" maxlength="80">
              </div>
            </div>
            <button class="btn b-who" type="submit" disabled>Continue</button>
          </form>
        </section>

        <section class="view v-pass" hidden>
          <h1>Enter the event password</h1>
          <div class="who-wrap">
            <button type="button" class="who"><span class="av"></span><span class="t"></span>${ICON.pencil}</button>
          </div>
          <form class="f-pass" novalidate>
            <input class="sr" type="text" name="username" autocomplete="username" value="EDC Lost Persons" tabindex="-1" aria-hidden="true">
            <div class="pw">
              <input class="input pass" type="password" placeholder="Event password" aria-label="Event password"
                autocomplete="current-password" enterkeyhint="go">
              <button type="button" class="eye" aria-label="Show password" aria-pressed="false">${ICON.eye}</button>
            </div>
            <div class="msg" role="alert"></div>
            <button class="btn b-pass" type="submit" disabled>Sign in</button>
          </form>
        </section>

        <section class="view v-done" hidden>
          <div class="done">
            <div class="ok">${ICON.check}</div>
            <div class="who" style="cursor:default"><span class="av"></span><span class="t"></span></div>
            <button type="button" class="link out">Sign out</button>
          </div>
        </section>
      </div>`;

    const $ = (s) => root.querySelector(s);
    const $$ = (s) => [...root.querySelectorAll(s)];
    const st = { name: '', team: '', other: '' };
    const team = () => (st.team === 'Other' ? st.other.trim() : st.team);
    const whoValid = () => st.name.trim().length >= 2 && st.team && team().length >= 2;

    function show(v) {
      $('.v-who').hidden = v !== 'who';
      $('.v-pass').hidden = v !== 'pass';
      $('.v-done').hidden = v !== 'done';
      if (v !== 'who') {
        $$('.av').forEach((el) => (el.textContent = initials(st.name)));
        $$('.who .t').forEach((el) => (el.innerHTML = `${esc(st.name.trim())} <i>· ${esc(label(team()))}</i>`));
        $('.v-pass .who').setAttribute('aria-label', `Signing in as ${st.name.trim()}, ${label(team())}. Change name or team.`);
      }
      if (!APP) return;
      setTimeout(() => {
        if (v === 'who') (st.name ? $('.name') : $('.name')).focus();
        if (v === 'pass') $('.pass').focus();
      }, 30);
    }

    // ---- step 1: who ----
    const nameIn = $('.name');
    const otherIn = $('.other');
    function paintWho() {
      $$('.opt').forEach((o) => o.classList.toggle('on', o.querySelector('input').checked));
      $('.other-row').hidden = st.team !== 'Other';
      $('.b-who').disabled = !whoValid();
    }
    nameIn.addEventListener('input', () => { st.name = nameIn.value; paintWho(); });
    $$('.opt input').forEach((r) => r.addEventListener('change', () => {
      st.team = r.value;
      paintWho();
      if (st.team === 'Other') setTimeout(() => otherIn.focus(), 0);
    }));
    otherIn.addEventListener('input', () => { st.other = otherIn.value; paintWho(); });
    nameIn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !st.team) { e.preventDefault(); $('.opt input').focus(); }
    });
    $('.f-who').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!whoValid()) return;
      if (APP) localStorage.setItem(PROFILE_KEY, JSON.stringify(st));
      show('pass');
    });

    // ---- step 2: password ----
    const passIn = $('.pass');
    const eye = $('.eye');
    const msg = $('.msg');
    function say(text) {
      msg.textContent = text || '';
      $('.pw').classList.toggle('err', Boolean(text));
    }
    passIn.addEventListener('input', () => { say(''); $('.b-pass').disabled = !passIn.value; });
    eye.addEventListener('click', () => {
      const on = passIn.type === 'password';
      passIn.type = on ? 'text' : 'password';
      eye.setAttribute('aria-pressed', String(on));
      eye.setAttribute('aria-label', on ? 'Hide password' : 'Show password');
      eye.innerHTML = on ? ICON.eyeOff : ICON.eye;
    });
    $('.v-pass .who').addEventListener('click', () => { say(''); passIn.value = ''; show('who'); });
    let sending = false;
    $('.f-pass').addEventListener('submit', (e) => {
      e.preventDefault();
      if (sending || !passIn.value) return;
      sending = true;
      const btn = $('.b-pass');
      btn.disabled = true;
      btn.classList.add('busy');
      btn.innerHTML = '<span class="spin" aria-hidden="true"></span>';
      btn.setAttribute('aria-busy', 'true');
      setTimeout(() => {
        sending = false;
        btn.classList.remove('busy');
        btn.setAttribute('aria-busy', 'false');
        if (passIn.value === DEMO_PASSWORD) {
          btn.innerHTML = ICON.check;
          setTimeout(() => {
            btn.innerHTML = 'Sign in';
            passIn.value = '';
            show('done');
          }, 450);
          return;
        }
        btn.innerHTML = 'Sign in';
        const pw = $('.pw');
        pw.classList.remove('shake');
        void pw.offsetWidth;
        pw.classList.add('shake');
        passIn.value = '';
        say('Incorrect password');
        passIn.focus();
      }, 650);
    });
    $('.out').addEventListener('click', () => show('pass'));

    // ---- initial state ----
    const saved = APP ? JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null') : null;
    Object.assign(st, saved || preset || {});
    nameIn.value = st.name;
    otherIn.value = st.other;
    $$('.opt input').forEach((r) => (r.checked = r.value === st.team));
    paintWho();
    if (preset && preset.password) { passIn.value = preset.password; $('.b-pass').disabled = false; }
    if (preset && preset.error) say(preset.error);
    show(saved ? 'pass' : (preset && preset.step) || 'who');
  }

  document.querySelectorAll('.screen').forEach((el) => {
    mount(el, el.dataset.preset ? JSON.parse(el.dataset.preset) : null);
  });
  if (APP) {
    const fit = () => document.querySelectorAll('.screen').forEach((el) => (el.style.minHeight = window.innerHeight + 'px'));
    fit();
    window.addEventListener('resize', fit);
  }
})();
</script>
</body>
</html>
