<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft · Loading skeletons</title>
<!-- Draft 2026-11-06. Loading states use Radix Themes' own <Skeleton> (shimmers in the real app). The header, view
     switcher and buttons render straight away; only the data is a placeholder, shaped like what will load.
     Real @radix-ui/themes 3.3.0 components, loaded from CDN (needs internet). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@radix-ui/themes@3.3.0/styles.css">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
html.standalone{background:#0c0c0d}html.standalone body{margin:0;padding:16px}
.radix-themes{--default-font-family:InterVariable,Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-feature-settings:"cv11";-webkit-font-smoothing:antialiased}
.radix-themes[data-is-root-theme]{min-height:0!important;height:100%;position:relative}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px 16px;max-width:760px}
.board figure{margin:0}.frame{height:640px;border-radius:30px;overflow:hidden;border:1px solid #2b2b30}
figcaption{margin-top:8px;text-align:center;font:12px/1.3 system-ui;color:#8e8e96}
.app{height:100%;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 12px}
.title{display:flex;align-items:center;gap:8px;min-width:0}
.live{flex:none;width:7px;height:7px;border-radius:50%;background:var(--gray-8)}
.vbar{display:flex;align-items:center;gap:8px;padding:0 12px 10px;border-bottom:1px solid var(--gray-a3)}
.vsw{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 9px 0 11px;border-radius:var(--radius-3);background:var(--gray-a3);color:var(--gray-12);font-size:15px;font-weight:500}
.vsw svg{color:var(--gray-11)}
.sp{flex:1}
.row{display:flex;gap:10px;padding:12px 16px}
.row+.row{border-top:1px solid var(--gray-a3)}
.rm{flex:1;display:flex;flex-direction:column;gap:8px}
.l{display:flex;align-items:center;gap:8px}
.scroll{flex:1;overflow:hidden;padding:12px 12px 90px;display:flex;flex-direction:column;gap:10px}
.card{border-radius:var(--radius-4);box-shadow:inset 0 0 0 1px var(--gray-a4);padding:16px;display:flex;flex-direction:column;gap:12px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fab{position:absolute!important;right:16px;bottom:24px;box-shadow:var(--shadow-5);z-index:5}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 14px 6px}
.nav>:last-child{justify-self:end}
.pbody{flex:1;overflow:hidden;padding:8px 14px 100px;display:flex;flex-direction:column;gap:14px}
.grp{border-radius:var(--radius-4);box-shadow:inset 0 0 0 1px var(--gray-a4);overflow:hidden}
.grp>*+*{border-top:1px solid var(--gray-a4)}
.gr{display:flex;align-items:center;gap:16px;height:44px;padding:0 14px}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px 14px 26px;background:var(--color-background);box-shadow:0 -1px 0 var(--gray-a4);display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
<script type="importmap">{"imports":{
"react":"https://esm.sh/react@18.3.1",
"react-dom":"https://esm.sh/react-dom@18.3.1",
"react-dom/client":"https://esm.sh/react-dom@18.3.1/client",
"@radix-ui/themes":"https://esm.sh/@radix-ui/themes@3.3.0?deps=react@18.3.1,react-dom@18.3.1",
"htm":"https://esm.sh/htm@3.1.1"}}</script>
</head><body><div id="b"></div>
<script type="module">
import React from 'react';
import { flushSync } from 'react-dom';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
import { Theme, Flex, Heading, Button, IconButton, Avatar, Skeleton } from '@radix-ui/themes';
if (location.protocol === 'file:' || location.protocol.startsWith('http')) document.documentElement.classList.add('standalone');
const h = htm.bind(React.createElement);
const svg = (p, s = 16) => h`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style=${{ flex: 'none' }} dangerouslySetInnerHTML=${{ __html: p }} />`;
const P = {
  x: '<path d="M18 6 6 18M6 6l12 12"/>', more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  chev: '<path d="m6 9 6 6 6-6"/>', plus: '<path d="M5 12h14M12 5v14"/>',
  search: '<circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/>',
  bellOff: '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M17 17H4a1 1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 .258-1.742"/><path d="m2 2 20 20"/><path d="M8.668 3.01A6 6 0 0 1 18 8c0 2.687.77 4.653 1.707 6.05"/>',
  list: '<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
};
const S = (w, hgt = 12, r) => h`<${Skeleton} width=${w} height=${hgt + 'px'} style=${r ? { borderRadius: r } : null}/>`;
const Shell = ({ dark, children }) => h`<${Theme} appearance=${dark ? 'dark' : 'light'} accentColor="gray" grayColor="gray" radius="medium"><div className="app" aria-busy="true">${children}</div><//>`;
const Top = () => h`<div className="top"><div className="title"><${Heading} size="3" weight="medium">Is my friend in medical?<//><span className="live"></span></div>
  <${Flex} align="center" gap="4"><${IconButton} variant="ghost" color="gray">${svg(P.search, 18)}<//><${IconButton} variant="ghost" color="gray">${svg(P.bellOff, 18)}<//><${Avatar} size="2" radius="full" variant="solid" color="gray" highContrast fallback="DK"/><//></div>`;
const Bar = ({ icon, title }) => h`<div className="vbar"><span className="vsw">${svg(P[icon], 16)}<span>${title}</span>${S('18px', 12, 4)}${svg(P.chev, 15)}</span><span className="sp"></span></div>`;
const Fab = () => h`<${Button} className="fab" size="3" radius="full" highContrast>${svg(P.plus, 16)} New request<//>`;
// Varied widths so the skeleton reads like real text, not a grid of identical bars.
const W = [['46%', '22%'], ['60%', '30%'], ['38%', '26%'], ['52%', '34%'], ['44%', '20%'], ['56%', '28%'], ['40%', '24%']];

const ListLoading = ({ dark }) => h`<${Shell} dark=${dark}><${Top}/><${Bar} icon="list" title="All requests"/>
  <div style=${{ flex: 1, overflow: 'hidden' }}>${W.map(([a, b], i) => h`<div key=${i} className="row">${S('14px', 14, '50%')}<div className="rm">
    <div className="l">${S(a, 13)}<span className="sp"></span>${S('34px', 11)}</div><div className="l">${S(b, 10)}${S('22%', 10)}</div></div></div>`)}</div><${Fab}/><//>`;

const Card = () => h`<div className="card"><div className="l" style=${{ alignItems: 'flex-start', gap: 12 }}>${S('40px', 40, '8px')}<div className="rm">${S('55%', 14)}${S('35%', 10)}</div>${S('44px', 20, '6px')}</div>
  <div className="rm">${S('92%', 11)}${S('64%', 11)}</div><div className="qa">${S('100%', 32, '8px')}${S('100%', 32, '8px')}</div></div>`;
const PendingLoading = ({ dark }) => h`<${Shell} dark=${dark}><${Top}/><${Bar} icon="inbox" title="Pending"/>
  <div className="scroll">${S('80px', 12)}<${Card}/><${Card}/>${S('64px', 12)}<${Card}/></div><${Fab}/><//>`;

const MCard = () => h`<div className="card"><div className="l" style=${{ alignItems: 'flex-start', gap: 12 }}>${S('40px', 40, '8px')}<div className="rm">${S('50%', 14)}${S('32%', 10)}</div>${S('28px', 10)}</div>
  ${S('58%', 13)}<div className="l" style=${{ justifyContent: 'space-between' }}>${[0, 1, 2, 3].map((i) => h`<${Skeleton} key=${i} width="10px" height="10px" style=${{ borderRadius: '50%' }}/>`)}</div></div>`;
const MineLoading = ({ dark }) => h`<${Shell} dark=${dark}><${Top}/><${Bar} icon="user" title="My requests"/>
  <div className="scroll"><${MCard}/><${MCard}/><${MCard}/></div><${Fab}/><//>`;

const ProfileLoading = ({ dark }) => h`<${Shell} dark=${dark}>
  <div className="nav"><${IconButton} variant="soft" color="gray" radius="full">${svg(P.x, 16)}<//>${S('64px', 12)}<${IconButton} variant="soft" color="gray" radius="full">${svg(P.more, 16)}<//></div>
  <div className="pbody">
    <div className="l" style=${{ gap: 14 }}>${S('64px', 82, '8px')}<div className="rm">${S('62%', 20)}${S('30%', 13)}${S('48%', 10)}</div></div>
    ${S('100%', 56, '10px')}
    <div className="grp">${['70%', '55%', '40%'].map((w, i) => h`<div key=${i} className="gr">${S('56px', 11)}${S(w, 12)}</div>`)}</div>
    <div className="grp">${['50%', '44%'].map((w, i) => h`<div key=${i} className="gr">${S('56px', 11)}${S(w, 12)}</div>`)}</div>
  </div>
  <div className="foot">${S('100%', 40, '8px')}${S('100%', 40, '8px')}</div><//>`;

const Board = () => h`<div className="board">
  <figure><div className="frame"><${ListLoading} dark/></div><figcaption>All requests · loading</figcaption></figure>
  <figure><div className="frame"><${PendingLoading}/></div><figcaption>Pending · loading</figcaption></figure>
  <figure><div className="frame"><${MineLoading}/></div><figcaption>My requests · loading</figcaption></figure>
  <figure><div className="frame"><${ProfileLoading} dark/></div><figcaption>Profile · loading, actions appear with the status</figcaption></figure>
</div>`;
flushSync(() => createRoot(document.getElementById('b')).render(h`<${Board}/>`));
</script></body></html>
