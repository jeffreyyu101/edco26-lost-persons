<title>Message lane</title>
<!-- 2026-11-07 ~23:45. FINAL: the message lane (angle A) with the judge's fixes from B and C. Brian: "HOW TO INDICATE THERES A
     MESSAGE ON A REQUEST... IN ALL REQUESTS VIEW I DONT SEE THAT" · "NOT CLUNKY" · "the request number [doesn't] need to be on
     that list" · "CLEAR THAT IT SIGNIFIES MESSAGES NOT JUST A BLUE DOT". Base: msg-indicator-a.html. Grafts: B (short labels,
     the real filled icon in the nav / Friend coming header), C (the involved gate).

     THE LANE: # goes; a fixed 31 px leading lane takes its place (.log first track minmax(47px,auto) = 16 px row padding + 31,
       gap 5: names start at x = 52 on every row). 31 = the "99+" bubble, so no count ever nudges the names. No column header.
     THE MARK (one shape, two strengths, lucide MessageSquare's silhouette):
       none ............. empty (no ghost bubble)
       read ............. outline MessageSquare 18 px, stroke 1.75, gray-11 (gray-10 on closed rows, not faded: 3:1+ both themes)
       unread for me .... filled bubble (CSS: 17 px body, 4.5 px corners, square bottom-left + 5 x 4.5 tail), white 12/700
                          tabular count inside, badge blue (blue-11 light / blue-8 dark, the AA-checked .badge tokens). 99+ from 100.
       "Unread for me" = unread > 0 AND involved AND the latest message is not mine (judge fix 1, from C). Otherwise, with
         messageCount > 0, the read outline. Without the gate every threaded row is blue for a dispatcher who has never
         opened those threads (the RPC counts all of them while the read cursor is null).
       A number in the lane always means "unread for me"; read rows carry no number. Only unread signal in the row.
     NEEDS INFO stays amber in Status; the lane stays blue / grey.
     STATUS LABELS under 430 px (judge fix 2, from B): Waiting for check → Waiting, Friend en route → En route,
       Friend arrived → Arrived, Recheck due → Recheck. Sentences keep the full label.
     TAP: the row is one button (openRowAt). The mark's span carries data-thread-badge; its ::before is the hit area: the row's
       left 52 px (gutter + lane + gap) x the full row height, anchored to the row so a two-line search row is covered and
       nothing hangs outside. Only rendered when a mark exists. Lands at Messages via openThread; anywhere else opens the top.
     SCREEN READERS: logRowLabel + " 1 unread message." / " 4 messages." / nothing. Fold: "Archived 6 requests. 3 unread messages."
     CLOSED: read mark gray-10; unread bubble stays full blue. Folded Archived row: the closed rows' (gated) unread total in the lane.
     SEARCH: same row; the LP number shows highlighted on the match line.
     DESK: the lane leads the table, before #; the count pill after the name goes. Docked at 1024–1279: # drops, the pane's top
       bar carries the LP number. Nav Pending + Pending's Friend coming header: <MessageSquare size={14} fill="currentColor"
       strokeWidth={0}> in the badge blue (was the 7 px dot); same logic as today's dot.
     Synthetic data only. Real @radix-ui/themes 3.3.0. Frames: 1 All 390 dark · 2 light · 3 360 long names · 4 search ·
       5 landed at Messages · 6 desk 1440 + docked 1240 · 7 the mark's states at 3x. -->

/* ---- the log (list.module.css .log / .lrow / .lr): # → the message lane ---- */
/* Track 1 = the row's 16 px padding + the 31 px lane (the "99+" bubble's width), never less, never more. */
.log{display:grid;grid-template-columns:minmax(47px,auto) minmax(min(80px,25%),1fr) auto auto auto;column-gap:5px}
.lrow{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;box-sizing:border-box;padding:0 16px}
.c1,.c2,.c3,.c4,.c5,.c45{grid-row:1;min-width:0}
.c1,.c4,.c5,.c45{min-width:auto}
.c1{grid-column:1}.c2{grid-column:2}.c3{grid-column:3}.c4{grid-column:4}.c5{grid-column:5}
.c45{grid-column:4/6;justify-self:end;display:flex;gap:6px}
.colh{position:sticky;top:0;z-index:3;height:24px;background:var(--color-background);font-size:11px;line-height:1;font-weight:500;letter-spacing:.01em;color:var(--gray-11);white-space:nowrap}
.colh>.c2{overflow:hidden;text-overflow:ellipsis}
.lr{position:relative;width:100%;min-height:48px;margin:0;border:0;background:none;color:var(--gray-12);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lr::after{content:"";grid-column:2/-1;grid-row:1;align-self:end;margin-right:-16px;border-bottom:1px solid var(--gray-a3)}
.lr2{padding-top:7px;padding-bottom:8px;row-gap:1px}
.lr2::after{grid-row:2;margin-bottom:-8px}
.nm{font-size:15px;line-height:20px;color:var(--gray-12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stc{min-width:20px;display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--gray-11);white-space:nowrap}
.stc.blue{color:var(--blue-11)}.stc.green{color:var(--green-11)}.stc.amber{color:var(--amber-11)}.stc.violet{color:var(--violet-11)}.stc.teal{color:var(--teal-11)}
.stl{max-width:10.5em;overflow:hidden;text-overflow:ellipsis}
.lg{flex:none;display:flex}
.tm{justify-self:end;font-size:13px;color:var(--gray-11);font-variant-numeric:tabular-nums;white-space:nowrap}
.c5.tm{min-width:28px;text-align:right}

mark{background:var(--amber-a5);color:inherit;border-radius:3px;padding:0 1px}

/* ---- THE MARK ---- */

.mc>svg{margin-left:-1.5px}                       /* MessageSquare's body starts 1.5 px into its box */
.closed .mc{color:var(--gray-10)}                 /* fix 4: exempt from the row's fade; gray-10 holds 3:1 in both themes */
/* fix 7: the hit area, CSS only, only when a mark exists: the row's left 52 px, full row height (anchored to the row). */
.lr .mc[data-thread-badge]::before{content:"";position:absolute;top:0;bottom:0;left:0;width:52px}
.ub{position:relative;display:inline-grid;place-items:center;min-width:20px;height:17px;box-sizing:border-box;padding:0 4.5px;
  border-radius:4.5px 4.5px 4.5px 0;background:var(--blue-11);color:#fff;font-size:12px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}

.ub::after{content:"";position:absolute;left:0;top:100%;width:5px;height:4.5px;background:inherit;clip-path:polygon(0 0,100% 0,0 100%)}
/* fix 5: nav + Friend coming header: the real icon, filled, in the badge blue */
.nb{flex:none;display:flex;color:var(--blue-11)}
.dark .nb{color:var(--blue-8)}

/* ---- Archived fold: a subgrid row, its unread sum in the lane ---- */

.pbox .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pbox .who{color:var(--gray-11)}
.udot{width:8px;height:8px;border-radius:50%;background:var(--blue-9);flex:none}

/* ---- desk (table.module.css; wide tracks as on main, the lane in front) ---- */

.dt .st.blue{color:var(--blue-11)}.dt .st.green{color:var(--green-11)}.dt .st.amber{color:var(--amber-11)}.dt .st.violet{color:var(--violet-11)}.dt .st.teal{color:var(--teal-11)}
.dt .x{font-variant-numeric:tabular-nums}.dt .x.red{color:var(--red-11)}.dt .x.amber{color:var(--amber-11)}.dt .x.gray{color:var(--gray-11)}

/* ---- 7 · states close-up (a spec sheet: rows cropped to lane · name · status, at 3x) ---- */
.sgrid{zoom:1.5;display:grid;grid-template-columns:auto 280px 280px;column-gap:12px;padding:14px 18px 18px}

.qh{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 8px}

.qh .qc{font-size:15px;line-height:20px;color:var(--gray-11);font-variant-numeric:tabular-nums}
.qh .qv{margin-left:auto;display:flex;color:var(--gray-11)}

<script type="module">
import React from 'react';
import { flushSync } from 'react-dom';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
import { Theme } from '@radix-ui/themes';
const h = htm.bind(React.createElement);
const svg = (p, s = 16, w = 1.75) => h`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${w} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style=${{ flex: 'none' }} dangerouslySetInnerHTML=${{ __html: p }} />`;
const P = {
  // lucide message-square: the app's message glyph (CardActivity MessageButton / MessageIconButton)
  msg: '<path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>', search: '<circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/>',
  chev: '<path d="m6 9 6 6 6-6"/>', chevR: '<path d="m9 18 6-6-6-6"/>', plus: '<path d="M5 12h14M12 5v14"/>',
  walk: '<circle cx="13" cy="4" r="2"/><path d="m7 21 2-6 3 3v3"/><path d="m9 12 2-4 3 2 3 1"/><path d="M11 8 8 9 6 12"/>',
  hour: '<path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>',
  hist: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  sort: '<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',
  dots: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  up: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
  cam: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  bust: '<circle cx="12" cy="10" r="5"/><path d="M2 26a10 9 0 0 1 20 0"/>',
  list: '<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/>', chart: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
};
// fix 5: <MessageSquare size={14} fill="currentColor" strokeWidth={0}>
const NavBubble = () => h`<span className="nb" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="0" dangerouslySetInnerHTML=${{ __html: P.msg }} /></span>`;
// ---- status glyphs (StatusGlyph + StageGlyph, main 6f75a34) ----
const pie = (f) => { const a = f * 2 * Math.PI, x = 7 + 3.25 * Math.sin(a), y = 7 - 3.25 * Math.cos(a); return `M7 7L7 3.75A3.25 3.25 0 ${f > 0.5 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z`; };
const box = (s, kids) => h`<svg width=${s} height=${s} viewBox="0 0 14 14" style=${{ flex: 'none' }} aria-hidden="true">${kids}</svg>`;
const gW = (s = 14) => box(s, h`<circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--blue-9)" strokeWidth="1.5"/>`);
const gQ = (s = 14) => box(s, h`<circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--amber-11)" strokeWidth="1.5"/><path d="M5.6 5.6a1.45 1.45 0 0 1 2.82.47c0 .97-1.42 1.3-1.42 1.3" fill="none" stroke="var(--amber-11)" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/><circle cx="7" cy="9.55" r="0.75" fill="var(--amber-11)"/>`);
const gIn = (s = 14) => box(s, h`<circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--green-9)" strokeWidth="1.5"/><path d=${pie(0.75)} fill="var(--green-9)"/>`);
const gDone = (s = 14) => box(s, h`<circle cx="7" cy="7" r="6.25" fill="var(--gray-8)"/><path d="M4.4 7.2l1.8 1.8 3.5-3.7" fill="none" stroke="var(--color-background)" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>`);
const gNF = (s = 14) => box(s, h`<circle cx="7" cy="7" r="6.25" fill="var(--gray-8)"/><path d="M5 5l4 4M9 5l-4 4" stroke="var(--color-background)" strokeWidth="1.6" strokeLinecap="round"/>`);
const gIc = (p, c, w = 2) => (s = 14) => h`<span style=${{ color: `var(--${c}-11)`, display: 'flex' }}>${svg(p, s + 1, w)}</span>`;
// n: the narrow label (under 430 px). fix 2: En route / Arrived / Recheck join Waiting.
const S = {
  waiting: { g: gW, t: 'Waiting for check', n: 'Waiting', c: 'blue' }, need: { g: gQ, t: 'Needs info', c: 'amber' },
  pending: { g: gIc(P.hour, 'violet'), t: 'Pending', c: 'violet' }, recheck: { g: gIc(P.hist, 'violet', 2.25), t: 'Recheck due', n: 'Recheck', c: 'violet' },
  located: { g: gIn, t: 'Located', c: 'green' }, enroute: { g: gIc(P.walk, 'teal'), t: 'Friend en route', n: 'En route', c: 'teal' },
  arrived: { g: gIc(P.check, 'green', 2.4), t: 'Friend arrived', n: 'Arrived', c: 'green' },
  notlocated: { g: gNF, t: 'Not located', c: 'gray', closed: true }, reunited: { g: gDone, t: 'Reunited', c: 'gray', closed: true },
  cancelled: { g: gDone, t: 'Cancelled', c: 'gray', closed: true },
};
const Shell = ({ dark = true, children }) => h`<${Theme} appearance=${dark ? 'dark' : 'light'} accentColor="gray" grayColor="gray" radius="medium"><div className="app">${children}</div><//>`;

// ---- the mark ----
// r.msgs = messageCount · r.unread = others' messages after my cursor · r.inv = involved · r.mine = lastMessage.mine
// fix 1 (the gate): blue only when unread > 0 && involved && !lastMessage?.mine.
const unreadForMe = (r) => (r.unread > 0 && r.inv && !r.mine ? r.unread : 0);
const fmt = (n) => (n > 99 ? '99+' : String(n));
const Bubble = ({ n }) => { const t = fmt(n); return h`<span className="ub" data-w=${t.length > 2 ? '3' : undefined}>${t}</span>`; };
const Mark = ({ r, cls = 'c1' }) => {
  const u = unreadForMe(r);
  if (u) return h`<span className=${cls + ' mc'} data-unread="" data-thread-badge="" aria-hidden="true"><${Bubble} n=${u}/></span>`;
  if (r.msgs) return h`<span className=${cls + ' mc'} data-thread-badge="" aria-hidden="true">${svg(P.msg, 18, 1.75)}</span>`;
  return h`<span className=${cls + ' mc'} aria-hidden="true"></span>`;
};
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
// fix 8: logRowLabel + " 2 unread messages." / " 3 messages." / nothing
const msgSaid = (r) => { const u = unreadForMe(r); return u ? ` ${plural(u, 'unread message')}.` : r.msgs ? ` ${plural(r.msgs, 'message')}.` : ''; };
const updSaid = (u = '—') => (u === '—' ? 'not updated yet' : u === 'now' ? 'updated just now' : `updated ${u.endsWith('m') ? plural(parseInt(u, 10), 'minute') : plural(parseInt(u, 10), 'hour')} ago`);
const say = (r) => `LP-${r.n}, ${r.nm}, ${S[r.k].t}, created ${r.cr || '11:00 PM'}, ${updSaid(r.up)}.${msgSaid(r)}`;
const foldSaid = (n, sum, open) => `Archived ${plural(n, 'request')}${!open && sum ? `. ${plural(sum, 'unread message')}.` : ''}`;

// ---- phone pieces ----
const Bar = ({ n }) => h`<div className="bar">
  <div className="lt"><span className="tx">All requests</span><span className="tc tab">${n}</span><span className="chv">${svg(P.chev, 18, 2.25)}</span><span className="sp"></span><span className="ib" aria-label="Search">${svg(P.search, 20)}</span><span className="av">DK</span></div>
  <div className="live"><span className="dot"></span><span>Updated just now</span><button type="button" className="rf" aria-label="Refresh now">${svg(P.refresh, 15, 2)}</button><span className="brk"></span>
    <button type="button" className="sort" aria-pressed="false" aria-label="Newest first. Sort by status, waiting for check first">${svg(P.sort, 14, 2)}Newest</button></div>
</div>`;
const ColH = () => h`<div className="lrow colh" aria-hidden="true"><span className="c1"></span><span className="c2">Friend</span><span className="c3">Status</span><span className="c45"><span>Created</span><span>Updated</span></span></div>`;
const hl = (text, q) => { const i = text.indexOf(q); if (!q || i < 0) return text; return h`${text.slice(0, i)}<mark>${q}</mark>${text.slice(i + q.length)}`; };
const Row = ({ r, q, crop }) => {
  const m = S[r.k];
  const line = q ? `LP-${r.n}` : '';
  return h`<button type="button" className=${'lrow lr' + (m.closed ? ' closed' : '') + (line ? ' lr2' : '')} data-closed=${m.closed ? '' : undefined}>
    <span className="vh">${say(r)}${line ? ` ${line}` : ''}</span>
    <${Mark} r=${r}/>
    <span className="c2 nm" aria-hidden="true">${r.nm}</span>
    <span className=${'c3 stc ' + m.c} aria-hidden="true"><span className="lg">${m.g(14)}</span><span className="stl">${m.n || m.t}</span></span>
    ${crop ? null : h`<span className="c4 tm" aria-hidden="true">${r.cr}</span><span className="c5 tm" aria-hidden="true">${r.up}</span>`}
    ${line ? h`<span className="match" aria-hidden="true">${hl(line, q)}</span>` : null}
  </button>`;
};
const Fold = ({ n, open, sum }) => h`<button type="button" className="fold" aria-expanded=${String(!!open)} aria-label=${foldSaid(n, sum, open)}>
  <span className="c1 mc" aria-hidden="true">${!open && sum ? h`<${Bubble} n=${sum}/>` : null}</span>
  <span className="fl" aria-hidden="true"><span className="lb">Archived</span><span className="cap">${n}</span><span className="sp"></span><span className="chx">${svg(open ? P.chev : P.chevR, 16, 2)}</span></span>
</button>`;
const Fab = () => h`<span className="fab">${svg(P.plus, 18, 2.25)}New request</span>`;
const Log = ({ open, closed, foldOpen, foldN }) => {
  const sum = closed.reduce((a, r) => a + unreadForMe(r), 0);
  return h`<div className="log" data-testid="request-list"><${ColH}/>
    ${open.map((r) => h`<${Row} key=${r.n} r=${r}/>`)}
    <${Fold} n=${foldN || closed.length} open=${foldOpen} sum=${sum}/>
    ${foldOpen ? closed.map((r) => h`<${Row} key=${r.n} r=${r}/>`) : null}
  </div>`;
};

// ---- data: Friday night, now 11:04 PM. Signed in as Dana K. (Dispatch, front of house). Synthetic. ----
const OPEN = [
  { n: 1021, nm: 'D.F.', k: 'waiting', cr: '11:02 PM', up: '—' },                                                  // no messages
  { n: 1020, nm: 'Kayla Martinez', k: 'need', cr: '10:58 PM', up: '1m', msgs: 3, unread: 1, inv: true },          // Needs info + 1 unread
  { n: 1019, nm: 'Christopher Montgomery', k: 'waiting', cr: '10:51 PM', up: '3m', msgs: 2, inv: true, mine: true }, // mine is latest
  { n: 1018, nm: 'B.W.', k: 'waiting', cr: '10:47 PM', up: '2m', msgs: 2, unread: 2, inv: true },                 // 2 unread
  { n: 1016, nm: 'Jordan Diaz', k: 'enroute', cr: '10:31 PM', up: 'now', msgs: 15, unread: 12, inv: true },       // 12 unread
  { n: 1015, nm: 'S.L.', k: 'located', cr: '10:20 PM', up: '21m', msgs: 4, unread: 4 },                            // never opened, not involved: the gate keeps it grey
  { n: 1014, nm: 'M.P.', k: 'pending', cr: '10:12 PM', up: '9m' },                                                  // Pending hold, none
  { n: 1013, nm: 'T.R.', k: 'arrived', cr: '9:58 PM', up: '4m', msgs: 5, inv: true },                              // read
];
const CLOSED = [
  { n: 1017, nm: 'A.N.', k: 'notlocated', cr: '10:36 PM', up: '6m', msgs: 2, unread: 1, inv: true },  // closed, new message: blue
  { n: 1012, nm: 'L.W.', k: 'reunited', cr: '9:41 PM', up: '25m', msgs: 6, inv: true },               // closed, old thread: gray-10
  { n: 1011, nm: 'N.G.', k: 'notlocated', cr: '9:30 PM', up: '40m' },
  { n: 1009, nm: 'C.H.', k: 'cancelled', cr: '9:12 PM', up: '1h', msgs: 1 },
];
const All = ({ dark = true }) => h`<${Shell} dark=${dark}><${Bar} n=${OPEN.length + CLOSED.length}/><div className="scroller"><${Log} open=${OPEN} closed=${CLOSED} foldOpen/></div><${Fab}/><//>`;

// 360, long names: names give way first; En route / Arrived / Recheck keep the status whole. Archived folded with its sum.
const LONG = [
  { n: 1024, nm: 'Christopher Montgomery', k: 'waiting', cr: '11:02 PM', up: '—', msgs: 1, unread: 1, inv: true },
  { n: 1022, nm: 'Kayla Martinez', k: 'need', cr: '10:58 PM', up: '1m', msgs: 3, unread: 2, inv: true },
  { n: 1021, nm: 'D.F.', k: 'need', cr: '10:51 PM', up: '1m', msgs: 2, inv: true },                           // Needs info, read
  { n: 1019, nm: 'Maximilian Okonkwo-Reyes', k: 'located', cr: '10:31 PM', up: '2m', msgs: 4, unread: 4 },   // not involved: grey
  { n: 1018, nm: 'Sofia Valentina Castellanos', k: 'pending', cr: '10:20 PM', up: '9m', msgs: 2, inv: true, mine: true },
  { n: 1017, nm: 'E.N.', k: 'recheck', cr: '10:12 PM', up: '21m' },
  { n: 1016, nm: 'Jordan Diaz', k: 'arrived', cr: '9:58 PM', up: '4m', msgs: 5, inv: true },
  { n: 1015, nm: 'Benjamin Hartley', k: 'waiting', cr: '9:51 PM', up: '6m' },
  { n: 998, nm: 'Alexandra Washington-Pierce', k: 'enroute', cr: 'Fri 11:58 PM', up: 'now', msgs: 14, unread: 12, inv: true }, // earlier day
];
const CLOSED3 = [{ unread: 1, inv: true }, { unread: 2, inv: true }, { unread: 5 }]; // 5 not involved: not counted → 3
const Narrow = () => h`<${Shell}><${Bar} n=${15}/><div className="scroller"><${Log} open=${LONG} closed=${CLOSED3} foldOpen=${false} foldN=${6}/></div><${Fab}/><//>`;

// Search "101": with # gone, the LP number shows (highlighted) on the match line.
const HITS = [...OPEN.slice(2, 8), CLOSED[0], CLOSED[1], CLOSED[2], { n: 1010, nm: 'J.K.', k: 'reunited', cr: '9:20 PM', up: '1h' }]
  .filter((r) => String(r.n).includes('101')).sort((a, b) => b.n - a.n);
const Search = () => h`<${Shell} dark=${false}>
  <div className="bar"><form role="search" className="search" onSubmit=${(e) => e.preventDefault()}>
    <div className="sfield">${svg(P.search, 16)}<span className="sq">101<span className="caret"></span></span><span className="sclear" aria-label="Clear search">${svg(P.x, 15)}</span></div>
    <span className="cancel">Cancel</span></form>
    <div className="cnt" aria-live="polite">${HITS.length} results</div></div>
  <div className="scroller"><div className="log"><${ColH}/>${HITS.map((r) => h`<${Row} key=${r.n} r=${r} q="101"/>`)}</div></div>
<//>`;

// ---- 5 · request page, landed at Messages (a tap in Kayla's lane). Top bar as on main; no New line. ----
const KV = ({ k, v, extra }) => h`<div className="kv"><span className="k">${k}</span><span className="v">${v}</span>${extra || h`<span></span>`}</div>`;
const PBar = ({ n }) => h`<div className="pbar"><span className="rb" aria-label="Close">${svg(P.x, 18, 2)}</span><span className="pid">LP-${n}</span><span className="rb r" aria-label="More">${svg(P.dots, 18, 2)}</span></div>`;
const Request = () => h`<${Shell}>
  <${PBar} n=${1020}/>
  <div className="scroller" data-at="messages"><div className="pbody">
    <div className="hero"><div className="portrait">${svg(P.bust, 56)}</div><div><div className="n">Kayla Martinez</div><div className="m">19 · Female</div><div className="m2">FA 3 – Kinetic · Dana K.</div></div></div>
    <div className="sblk">${gQ(18)}<div><div className="t1">Needs info</div><div className="t2">Rae C. asked · 11:03 PM</div></div></div>
