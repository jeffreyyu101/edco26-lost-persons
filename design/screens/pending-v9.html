<title>Pending v9</title>
<!-- v9.1 (Brian, 2026-11-06 ~20:20): Not found yet is an INDICATOR, not a lane. Held / due requests stay in Waiting for check in
     plain longest-wait order with their wait time showing (that's what medical needs to see: waiting a while, not found, confirm or clear).
     A violet chip says "Not found yet"; after 20 min it reads "Recheck due" (still violet). The ONLY time shown is the elapsed wait (no recheck time, no "not found 4:20"). Nothing moves, no Later group anywhere.
     Within Waiting for check everything is longest wait first (Needs info included). The friend's name/relationship line is removed from
     Friend coming cards. The notes below are v9 and are superseded where they mention Later or Recheck-on-top. -->
<!-- 2026-11-06 evening. FINAL v9 (hybrid of angles A and B, per the judge). Brian: "for the pending screen u need to show
     waiting for check above friend coming … there also needs to be a way to sort by status so they can easily like click it
     and it shows waiting at the top then the rest". Base = pending-v9-b.html (structure, cards, fold); grafted from
     pending-v9-a.html: the live line, the desk/tablet two-column board, the full status cell. Mobbin refs: design/references/mobbin-pending-sort.txt.

     STATUS ORDER (one order everywhere a list is in status order)
       Waiting for check   1 Recheck due ........ most overdue first (blue Recheck chip in the timer slot)
                           2 Waiting for check .. longest wait first (red timers on top)
                           3 Needs info ......... longest wait first (medical acts on 2 before 3; the jump up when answered is the signal)
       Friend coming       4 Friend arrived ..... earliest arrival first
                           5 Friend en route .... soonest ETA first, no ETA last
                           6 In medical ......... nobody coming; longest since found first
       Later               7 Not found yet ...... held; soonest recheck first; when due it becomes rank 1
       Archived            8 Reunited, Not found in medical, Discharged, Cancelled; folded; newest closed first
     The four group names are identical on Pending, All requests and My requests ("Closed" instead of "Archived" on My).
     Not found yet rows keep their violet tag under the Later divider.

     PENDING, phone (< 768 px): one scroll — title row, live line ("● Updated just now ⟳", 40 px), Waiting for check,
       Friend coming, Later. No sort control (Pending is already in status order). The SegmentedControl is gone.
       Section header = one 44 px button row: glyph · label · count · chevron. It pins while its section scrolls and one tap
       folds it; a folded header keeps its most urgent value on the right (oldest wait, heat-coloured; next recheck time).
       Empty Waiting keeps its header with a dimmed glyph and 0; Friend coming never moves up. "Pending N" = Waiting + Friend coming.
       Fold memory: the Waiting fold is session-only (never persisted) and re-opens by itself when the Waiting count rises.
       Friend coming and Later folds persist per device (localStorage, every read/write in try/catch). Later starts folded.
     PENDING, desk + tablet (>= 768 px): two-column board, Waiting for check left, Friend coming right; each column scrolls on
       its own; Later is pinned to the bottom of the Waiting column. Board headers keep the chevron (fold parity with phone).
     Friend coming timers are gray-11 only. Red / amber mean "waiting for check too long" and never appear on a found patient.

     SORT (All requests, My requests): one-tap toggle button at the right end of the live line (aria-pressed + polite live
       region). Its label names the current order: outline "⇅ Newest" (All default) or "⇅ Updated" (My default, latest
       update first) → filled gray-a4 "⇅ Status". No menu. At <= 360 px (container query) it drops to its own row, left-aligned.
       Choice remembered per view per device (try/catch). The production filter-chip row stays filter chips only.
       In status order the list gets thin pinned dividers (glyph · label · count) and Archived / Closed folds last (›).
       Status cells keep the full tag in every order: phone "○ Waiting for check"; desk "○ Waiting for check · 27m"
       (heat-coloured value), "⧗ Not found yet · 4:40 PM", "Friend en route · ~4 min", "Friend arrived · 4:29 PM".
     DESK TABLE: the header is the sort control; only the active column is gray-12 with an arrow. Default "Created ↓"
       (aria-sort descending). Click Status → "Status ↓", aria-sort="other". Clicking Status again returns to Created ↓
       (no reverse status order). Inactive headers show a faint ↕ on hover / focus only.
     GLYPHS: lucide history = Recheck (chips, status tag, Later value). refresh-cw = the live line's Refresh button only.
     CONTRAST: meta, counts, row numbers, chevrons, Updated column: gray-11 (DECISIONS.md accessibility pass). No gray-10 text.
     BUILD: components/list/ListViews.tsx already stacks SectionHeader sections (Friend coming first, ~line 248) — swap the
       order, restyle the header to this 44 px row with sticky + fold, add Later as a third folded section, add the toggle
       to All / My. The v8 SegmentedControl never shipped.
     Frames: 1–3 Pending phone (top, Waiting folded, nothing to check) · 4 tablet 820 light · 5 desk 1240 · 6 All by status ·
       7 All newest (light) · 8 All desk by status · 9 My by status (430 × 932, so Closed is in view). Synthetic data only (initials). -->

// desk table: the header is the sort control. Default Created ↓; Status ↓ (aria-sort other); Status again → Created ↓.
const DeskHead = ({ by }) => h`<div className="dt h" role="row"><span role="columnheader">#</span><span role="columnheader">Friend</span>
  <span role="columnheader" aria-sort=${by === 'status' ? 'other' : undefined}><button type="button" className=${'thb' + (by === 'status' ? ' on' : '')}
    aria-label=${by === 'status' ? 'Status, sorted waiting for check first. Sort by newest' : 'Status. Sort by status, waiting for check first'}>Status${by === 'status' ? svg(P.down, 13, 2.25) : null}</button></span>
  <span role="columnheader">Post</span>
  <span role="columnheader" className="ra" aria-sort=${by === 'created' ? 'descending' : undefined}><button type="button" className=${'thb' + (by === 'created' ? ' on' : '')}
    aria-label=${by === 'created' ? 'Created, newest first. Sort oldest first' : 'Created. Sort by newest'}>Created${by === 'created' ? svg(P.down, 13, 2.25) : null}</button></span>
  <span role="columnheader" className="ra">Updated</span><span role="columnheader" className="lb">Logged by</span></div>`;
const DeskRow = ({ id }) => { const [n, nm, as, k, t, x, xc, post, up, by] = ROWS[id]; return h`<div className="dt r" role="row"><span className="num">${n}</span><span className="nm2">${nm}<small>${as}</small></span><${St} k=${k} x=${x} xc=${xc}/><span className="mut">${post}</span><span className="ra mut tab">${t}</span><span className="ra mut tab">${up}</span><span className="mut lb">${by}</span></div>`; };
const AllDesk = () => h`<${Theme} appearance="dark" accentColor="gray" grayColor="gray" radius="medium"><div className="dwin"><${Side} on="all"/>
  <main className="dmain"><${DTop} title="All requests" n=${13}/>
    <div className="dsc" role="table" aria-label="All requests, sorted by status"><${DeskHead} by="status"/>
      ${GROUPS.map((G) => h`<section key=${G.t}><div className="dgh" role="heading" aria-level="2">${G.g(14)}<span>${G.t}</span><span className="n">${G.rows.length}</span></div>${G.rows.map((id) => h`<${DeskRow} key=${id} id=${id}/>`)}</section>`)}
      <${Arch} desk/>
    </div></main></div><//>`;

// ---- 9 My requests (front of house), status order ----------------------------------------------------------
const chipC = (c, ic, t, solid) => h`<span className="chipc" style=${{ background: solid ? `var(--${c}-a4)` : 'none', boxShadow: solid ? 'none' : `inset 0 0 0 1px var(--${c}-a6)`, color: tint(c) }}>${ic}${t}</span>`;
const MineStatus = () => h`<${Shell}><${Bar} title="My requests" n=${5} sort=${{ on: true, view: 'mine' }}/>
  <div className="scroller mine">
    <section><${GD} G=${GROUPS[0]} n=${3}/><div className="cards">
      <div className="card" aria-label="S.O., 28 male, not found yet, waiting 47 minutes"><div className="l1"><span className="nm">S.O.</span><span className="as">28 M</span><span className="wait red">${svg(P.clock, 13, 2)}47m</span></div>
        <div className="row2">${chipC('violet', svg(P.hour, 13, 2), 'Not found yet')}</div>
        <span className="btn outline">${svg(P.msg, 16)}Message</span></div>
      <div className="card" aria-label="J.D., mid-20s male, needs info, 1 unread question"><div className="l1"><span className="nm">J.D.</span><span className="as">mid-20s M</span><span className="wait"><span className="need">${gQ(13)}Needs info</span></span></div>
        <div className="qprev"><span className="ud"></span><span className="tx"><span className="who">Rae C.:</span> Any tattoos or marks?</span></div>
        <span className="btn outline mbtn">${svg(P.msg, 16)}Message<span className="badge">1</span></span></div>
      <div className="card" aria-label="E.N., 23, waiting 1 minute"><div className="l1"><span className="nm">E.N.</span><span className="as">23</span><span className="wait">${svg(P.clock, 13, 2)}1m</span></div>
        <span className="btn outline">${svg(P.msg, 16)}Message</span></div>
</div></section>
    <section><${GD} G=${GROUPS[1]} n=${1}/><div className="cards">
      <div className="card" aria-label="A.L., 21 female, in medical at Chair 14, friend en route about 4 minutes"><div className="l1"><span className="nm">A.L.</span><span className="as">21 F</span><span className="wait">${gIn(16)}</span></div>
        <div className="row2"><span className="loc">${svg(P.pin, 14, 2)}Chair 14</span></div>
        <div className="enr teal">${svg(P.walk, 18, 2)}Friend en route<span className="m">~4 min</span>${svg(P.chevR, 16, 2.25)}</div>
        <div className="two"><span className="btn outline">${svg(P.check, 16, 2)}Arrived</span><span className="btn outline">${svg(P.msg, 16)}Message</span></div></div></div></section>
    <${Arch} label="Closed" n=${1}/>
    <div style=${{ height: 24 }}></div>
  </div><//>`;

// ---- board -------------------------------------------------------------------------------------------------------
const Toast = ({ t }) => h`<div style=${{ position: 'absolute', left: 12, right: 12, bottom: 34, height: 48, borderRadius: 12, background: 'var(--gray-12)', color: 'var(--gray-1)', display: 'flex', alignItems: 'center', padding: '0 6px 0 16px', fontSize: 15, fontWeight: 500, zIndex: 9 }}>${t}<span style=${{ marginLeft: 'auto', height: 36, padding: '0 12px', display: 'grid', placeItems: 'center', fontWeight: 600 }}>Undo</span></div>`;
const OneCard = ({ r, toast }) => h`<${Shell}><${Bar} title="Pending" n=${10}/><div className="scroller"><div className="pl"><section className="psec"><${QH} g=${gW} label="Waiting for check" n=${7} open/><div className="cards"><${CheckCard} r=${r}/></div></section></div></div>${toast ? h`<${Toast} t=${toast}/>` : null}<//>`;
// ---- close-button variants (Brian 20:35: "Close · not found" is cramped; keep it clear without clutter) ----
P.archive = P.archive || '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>';
const DueCard = ({ variant }) => { const r = { ...WAIT[3], k: 'recheck', ind: 'due', m: 47 };
  const head = h`<div style=${{ display: 'flex', gap: 12 }}>${r.photo ? h`<div className="photo">${svg(P.bust, 48)}</div>` : null}
    <div style=${{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 4 }}>
      <div className="l1"><span className="nm">${r.nm}</span><span className="as">${r.as}</span><span className=${'wait ' + heat(r.m)}>${svg(P.clock, 13, 2)}${r.m}m</span></div>
      <div className="desc">${r.d}</div><div className="meta2">${r.meta}</div></div></div>`;
  const chip = chipC('violet', svg(P.hist, 13, 2.25), 'Recheck due', true);
  const green = h`<span className="btn green">${svg(P.check, 16, 2.25)}In medical</span>`;
  if (variant === 'a') return h`<div className="card">${head}<div className="row2">${chip}</div>
    <div className="acts3"><${MsgBtn}/><span className="btn soft" aria-label="Not found, close it">${svg(P.x, 16)}Not found</span>${green}</div></div>`;
  if (variant === 'b') return h`<div className="card">${head}<div className="row2">${chip}</div>
    <div className="acts3"><${MsgBtn}/><span className="btn soft" aria-label="Close as not found in medical">${svg(P.archive, 16)}Close</span>${green}</div></div>`;
  if (variant === 'c') return h`<div className="card">${head}<div className="row2" style=${{ justifyContent: 'space-between', flexWrap: 'nowrap' }}>${chip}<span style=${{ flex: 'none', width: 44, display: 'grid' }}><${MsgBtn}/></span></div>
    <div className="two"><span className="btn soft" aria-label="Close as not found in medical">${svg(P.x, 16)}Close · not found</span>${green}</div></div>`;
  return h`<div className="card">${head}<div className="row2">${chip}</div>
    <div className="acts3"><${MsgBtn}/><span className="btn soft" style=${{ flexDirection: 'column', gap: 0, lineHeight: 1.1 }} aria-label="Not found, close it"><span style=${{ display: 'flex', alignItems: 'center', gap: 6 }}>${svg(P.x, 15)}Not found</span><span style=${{ fontSize: 11.5, fontWeight: 500, color: 'var(--gray-11)' }}>closes it</span></span>${green}</div></div>`; };
const DueFrame = ({ variant, toast }) => h`<${Shell}><${Bar} title="Pending" n=${10}/><div className="scroller"><div className="pl"><section className="psec"><${QH} g=${gW} label="Waiting for check" n=${7} open/><div className="cards"><${DueCard} variant=${variant}/></div></section></div></div>${toast ? h`<${Toast} t=${toast}/>` : null}<//>`;
const CloseBoard = () => h`<div className="board">
  <${Fig} cap="A · Not found yet → Not found" sub="Same word, no 'yet' = final; toast confirms the close"><${DueFrame} variant="a" toast="B.W. closed · not found in medical"/><//>
  <${Fig} cap="B · Close (archive glyph)" sub="One short verb; the Recheck due chip gives the why"><${DueFrame} variant="b"/><//>
  <${Fig} cap="C · Message moves up" sub="Full label fits: message icon sits by the chip"><${DueFrame} variant="c"/><//>
  <${Fig} cap="D · Two-line button" sub="Not found + small 'closes it'"><${DueFrame} variant="d"/><//>
</div>`;
const ButtonsBoard = () => h`<div className="board">
  <${Fig} cap="A · First check" sub="Not found yet keeps it open (20 min hold)"><${OneCard} r=${WAIT[3]}/><//>
  <${Fig} cap="B · Tapped Not found yet" sub="Chip says Not found yet; the left button becomes × Not found (closes)"><${OneCard} r=${{ ...WAIT[3], k: 'held', ind: 'held' }} toast="Not found yet · recheck in 20 min"/><//>
  <${Fig} cap="C · Recheck due (20 min later)" sub="× Not found closes it; In medical if they're there"><${OneCard} r=${{ ...WAIT[3], k: 'recheck', ind: 'due', m: 47 }}/><//>
  <${Fig} cap="D · Closed" sub="Second answer closes it, with Undo"><${OneCard} r=${WAIT[4]} toast="B.W. closed · not found in medical"/><//>
</div>`;
const Fig = ({ cap, sub, cls = '', children }) => h`<figure><div className=${'frame ' + cls}>${children}</div><figcaption>${cap}<span>${sub}</span></figcaption></figure>`;
const Board = () => h`<div className="board">
  <${Fig} cap="1 · Pending" sub="Waiting longest first; Not found yet stays in place with its wait"><${PendingTop}/><//>
  <${Fig} cap="2 · Waiting folded" sub="One tap; folded header keeps the oldest wait (51m)"><${PendingFolded}/><//>
  <${Fig} cap="3 · Nothing to check" sub="Header stays with 0; Friend coming never moves up"><${PendingEmpty}/><//>
  <${Fig} cls="ipad" cap="4 · Pending, tablet 820 (light)" sub="Board from 768 px; columns scroll apart; no Later lane"><${PendingTablet}/><//>
  <${Fig} cls="desk tall" cap="5 · Pending, desk 1240" sub="Same board; headers keep the chevron"><${PendingDesk}/><//>
  <${Fig} cap="6 · All requests by status" sub="Waiting longest first; Recheck is just a tag"><${AllStatus}/><//>
  <${Fig} cap="7 · All requests, newest (light)" sub="Default ⇅ Newest; one tap → frame 6"><${AllNewest}/><//>
  <${Fig} cls="desk" cap="8 · All requests, desk, by status" sub="Status ↓; waiting rows show their wait, e.g. Not found yet · 47m"><${AllDesk}/><//>
  <${Fig} cls="max" cap="9 · My requests by status, 430 × 932" sub="Waiting longest first incl. Not found yet; Closed folded last"><${MineStatus}/><//>
</div>`;
flushSync(() => createRoot(document.getElementById('b')).render(location.hash === '#buttons' ? h`<${ButtonsBoard}/>` : location.hash === '#close' ? h`<${CloseBoard}/>` : h`<${Board}/>`));
window.__layout = () => document.querySelectorAll('.colsec,.scroller').forEach((c) => { c.scrollTop = 0; });
window.__layout();
document.fonts.ready.then(() => { window.__layout(); document.body.dataset.ready = '1'; });
</script></body></html>
