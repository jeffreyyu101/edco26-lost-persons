<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar Port</title>
<style>
  .stage { --g1:#111111; --g2:#191919; --g3:#222222; --g4:#2a2a2a; --g5:#313131; --g6:#3a3a3a; --g7:#484848; --g8:#606060; --g9:#6e6e6e; --g10:#7b7b7b; --g11:#b4b4b4; --g12:#eeeeee;
    --ga3:rgba(255,255,255,.07); --ga4:rgba(255,255,255,.105); --ga5:rgba(255,255,255,.13); --ga6:rgba(255,255,255,.17);
    --blue:#70b8ff; --green:#3dd68c; --violet:#baa7ff; --msg:#70b8ff; --shadow:0 1px 2px rgba(0,0,0,.5);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage[data-theme="light"] { --g1:#fcfcfc; --g2:#f9f9f9; --g3:#f0f0f0; --g4:#e8e8e8; --g5:#e0e0e0; --g6:#d9d9d9; --g7:#cecece; --g8:#bbbbbb; --g9:#8d8d8d; --g10:#838383; --g11:#646464; --g12:#202020;
    --ga3:rgba(0,0,0,.055); --ga4:rgba(0,0,0,.085); --ga5:rgba(0,0,0,.12); --ga6:rgba(0,0,0,.15);
    --blue:#0d74ce; --green:#218358; --violet:#6550b9; --msg:#0d74ce; --shadow:0 1px 2px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04); }
  * { box-sizing: border-box; }
  .bar { display:flex; gap:8px; align-items:center; margin: 0 0 14px; }
  .seg { display:inline-flex; padding:2px; border-radius: 8px; background: var(--secondary, #222); gap:2px; }
  .seg button { all:unset; cursor:pointer; font: 500 12.5px/1 var(--font-sans, system-ui); padding:7px 11px; border-radius:6px; color: var(--muted-foreground, #aaa); }
  .seg button[aria-pressed="true"] { background: var(--background, #111); color: var(--foreground, #eee); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .kbd-hint { margin-left:auto; font: 12px/1 var(--font-mono, ui-monospace); color: var(--muted-foreground, #999); }
  .label { display:flex; align-items:center; gap:8px; font: 600 13px/1 var(--font-sans, system-ui); color: var(--foreground, #eee); margin: 18px 0 8px; }
  .label:first-of-type { margin-top: 0; }
  .label .chip { font: 500 11px/1 var(--font-mono, ui-monospace); padding:3px 6px; border-radius:5px; background: var(--secondary, #222); color: var(--muted-foreground, #aaa); }
  .tile { position:relative; height: 520px; border-radius: 12px; overflow:hidden; border: 1px solid var(--border, #333); }

  /* ---------- shared desk ---------- */
  .desk { display:flex; height:100%; background: var(--g1); color: var(--g12); font-size:14px; }
  .main { flex:1; min-width:0; display:flex; flex-direction:column; background: var(--g1); }
  svg.i { width:16px; height:16px; flex:none; fill:none; stroke: currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
  .lock { position:relative; display:flex; align-items:center; justify-content:center; gap:10px; height:44px; border-radius:10px; isolation:isolate; color-scheme:dark;
    background: radial-gradient(ellipse at 10% 140%, rgb(232 63 145 / .55) 0, transparent 55%), radial-gradient(ellipse at 88% -50%, rgb(37 199 215 / .45) 0, transparent 50%), linear-gradient(112deg, #181329 4%, #36205a 55%, #211835 100%); }
  .lock .edc { height:24px; filter: brightness(0) invert(1); }
  .lock .div { width:1px; height:18px; background: rgb(255 255 255 / .33); }
  .lock .gc { height:19px; }
  .lock .live { position:absolute; top:-3px; right:-3px; width:10px; height:10px; border-radius:50%; background:#3dd68c; box-shadow: 0 0 0 2px var(--g2); }
  .msgdot { width:12px; height:12px; flex:none; fill: var(--msg); stroke:none; order:1; }
  .sw { position:relative; width:32px; height:18px; border-radius:9px; background: var(--g12); flex:none; }
  .sw::after { content:""; position:absolute; top:2px; left:16px; width:14px; height:14px; border-radius:50%; background: var(--g1); }
  .table { flex:1; overflow:hidden; }
  .th, .tr { display:grid; grid-template-columns: 52px minmax(0,1fr) 168px 52px; align-items:center; padding: 0 20px; column-gap: 8px; }
  .th { height:36px; font-size:12.5px; color: var(--g11); border-bottom:1px solid var(--ga4); }
  .tr { height:44px; border-bottom:1px solid var(--ga3); }
  .tr .n { color: var(--g11); font-variant-numeric: tabular-nums; font-size:13px; }
  .tr .who { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tr .who small { color: var(--g11); font-size:12.5px; margin-left:6px; }
  .st { display:flex; align-items:center; gap:7px; font-size:13.5px; white-space:nowrap; }
  .st svg.i { width:15px; height:15px; }
  .st.wait { color: var(--blue); } .st.pend { color: var(--violet); } .st.loc { color: var(--green); }
  .tr .ago, .th .r { text-align:right; color: var(--g11); font-variant-numeric: tabular-nums; font-size:13px; }
  .fold { display:flex; align-items:center; gap:10px; height:44px; padding:0 20px; color: var(--g12); border-bottom:1px solid var(--ga3); }
  .fold .c { font-size:12px; padding:2px 8px; border-radius:10px; background: var(--ga4); color: var(--g11); }
  .fold svg { margin-left:auto; color: var(--g11); }

  /* ---------- NOW (components/desk/desk.module.css as it is today) ---------- */
  .now .side { width:232px; flex:none; display:flex; flex-direction:column; padding:14px 10px; background: var(--g2); border-right:1px solid var(--ga4); }
  .now .brand { padding: 0 0 14px; }
  .now .views { display:flex; flex-direction:column; gap:1px; }
  .now .ni { display:flex; align-items:center; gap:10px; height:32px; padding:0 8px; border-radius:7px; color: var(--g11); font-size:14px; }
  .now .ni svg.i { color: var(--g10); }
  .now .ni.on { background: var(--ga4); color: var(--g12); font-weight:500; }
  .now .ni.on svg.i { color: var(--g12); }
  .now .ni .nc { order:2; margin-left:auto; font-size:12.5px; color: var(--g11); font-variant-numeric: tabular-nums; font-weight:400; }
  .now .sep { height:1px; background: var(--ga4); margin:10px 8px; }
  .now .sp { flex:1; }
  .now .bell { display:flex; align-items:center; gap:10px; height:32px; padding:0 8px; color: var(--g11); }
  .now .bell svg.i { color: var(--g10); }
  .now .bell .sw { margin-left:auto; }
  .now .me { display:flex; align-items:center; gap:10px; margin-top:2px; padding:8px; border-radius:8px; }
  .now .av { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:600; background: var(--g12); color: var(--g1); flex:none; }
  .now .mt { display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
  .now .mn { font-size:14px; font-weight:500; }
  .now .mteam { font-size:12.5px; color: var(--g11); }
  .now .me > svg.i { width:14px; height:14px; color: var(--g11); }
  .now .top { display:flex; align-items:center; gap:10px; height:56px; padding:0 16px 0 20px; border-bottom:1px solid var(--ga4); flex:none; }
  .now .top h1 { margin:0; font-size:20px; font-weight:600; letter-spacing:-.01em; }
  .now .top .cnt { font-size:18px; color: var(--g11); font-weight:400; margin-left:2px; }
  .now .top .sp { flex:1; }
  .now .ib { width:36px; height:36px; border-radius:8px; display:grid; place-items:center; color: var(--g11); }
  .now .ib svg.i { width:18px; height:18px; }
  .now .new { display:flex; align-items:center; gap:8px; height:36px; padding:0 8px 0 12px; border-radius:8px; background: var(--g12); color: var(--g1); font-weight:600; font-size:14px; }
  .now .new kbd { font: 600 11px/1 ui-monospace, monospace; padding:3px 6px; border-radius:5px; border:1px solid rgba(127,127,127,.45); }

  /* ---------- PORT (shadcn/ui Sidebar: sizes + spacing, Radix gray tokens) ---------- */
  .port .desk { background: var(--g2); }
  .port .side { --w: 256px; width: var(--w); flex:none; position:relative; display:flex; flex-direction:column; background: var(--g2); color: var(--g12); transition: width .2s linear; overflow:hidden; }
  .port.flush .side { border-right:1px solid var(--ga4); }
  .port .shead, .port .sfoot { display:flex; flex-direction:column; gap:8px; padding:8px; }
  .port .scontent { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; overflow:hidden; }
  .port .group { display:flex; flex-direction:column; padding:8px; }
  .port .group + .ssep + .group { padding-top: 8px; }
  .port .menu { display:flex; flex-direction:column; gap:4px; }
  .port .mb { position:relative; display:flex; align-items:center; gap:8px; height:32px; padding:8px; border-radius:6px; font-size:14px; line-height:20px; color: var(--g12); white-space:nowrap; overflow:hidden; cursor:pointer; transition: width .2s linear, height .2s linear, padding .2s linear, background-color .12s; }
  .port .mb:hover { background: var(--g4); }
  .port .mb.on { background: var(--g4); font-weight:500; }
  .port .mb .lbl { overflow:hidden; text-overflow:ellipsis; }
  .port .badge { position:absolute; right:4px; top:6px; height:20px; min-width:20px; padding:0 4px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; font-variant-numeric: tabular-nums; color: var(--g12); pointer-events:none; }
  .port .mb .msgdot { margin-left:2px; }
  .port .ssep { height:1px; background: var(--ga4); margin: 0 16px; flex:none; }
  .port .lg { height:48px; padding:8px; }
  .port .lock { flex:1; height:48px; border-radius:8px; margin:-8px; }
  .port .shead .lg { padding:0; }
  .port .shead .lock { margin:0; }
  .port .shead .mb:hover { background: none; }
  .port .av { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size:12px; font-weight:600; background: var(--g5); color: var(--g12); flex:none; }
  .port .ut { display:grid; flex:1; min-width:0; line-height:1.25; text-align:left; }
  .port .ut b { font-weight:500; font-size:14px; overflow:hidden; text-overflow:ellipsis; }
  .port .ut span { font-size:12px; color: var(--g11); overflow:hidden; text-overflow:ellipsis; }
  .port .mb .end { margin-left:auto; flex:none; }
  .port .rail { position:absolute; top:0; bottom:0; right:-8px; width:16px; z-index:3; cursor: w-resize; }
  .port .rail::after { content:""; position:absolute; top:0; bottom:0; left:7px; width:2px; background: transparent; transition: background .15s; }
  .port .rail:hover::after { background: var(--ga6); }
  .port .main { position:relative; }
  .port.inset .main { margin:8px 8px 8px 0; border-radius:12px; box-shadow: var(--shadow); overflow:hidden; }
  .port .top { display:flex; align-items:center; gap:4px; height:48px; padding:0 16px; border-bottom:1px solid var(--ga4); flex:none; }
  .port .gh { all:unset; cursor:pointer; width:28px; height:28px; border-radius:6px; display:grid; place-items:center; color: var(--g12); }
  .port .gh:hover { background: var(--g4); }
  .port .top .trig { margin-left:-4px; }
  .port .top .vsep { width:1px; height:16px; background: var(--ga5); margin: 0 8px; }
  .port .top h1 { margin:0; font-size:16px; font-weight:500; }
  .port .top .cnt { font-size:16px; color: var(--g11); font-weight:400; margin-left:6px; font-variant-numeric: tabular-nums; }
  .port .top .sp { flex:1; }
  .port .btn { display:flex; align-items:center; gap:6px; height:32px; padding:0 6px 0 12px; border-radius:6px; background: var(--g12); color: var(--g1); font-size:14px; font-weight:500; margin: 0 4px; }
  .port .btn kbd { font: 500 11px/1 ui-monospace, monospace; padding:3px 5px; border-radius:4px; background: rgba(127,127,127,.22); }
  /* collapsed = shadcn collapsible="icon" */
  .port[data-collapsed] .side { --w: 48px; }
  .port.inset[data-collapsed] .side { --w: 64px; }
  .port[data-collapsed] .mb { width:32px; height:32px; padding:8px; }
  .port[data-collapsed] .mb .lbl, .port[data-collapsed] .badge, .port[data-collapsed] .mb .end, .port[data-collapsed] .ut, .port[data-collapsed] .mb .msgdot { display:none; }
  .port[data-collapsed] .mb.pdot::after { content:""; position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background: var(--msg); box-shadow: 0 0 0 2px var(--g2); }
  .port[data-collapsed] .lg { width:32px; height:32px; padding:0; }
  .port[data-collapsed] .shead .lock { width:32px; height:32px; flex:none; gap:0; border-radius:8px; }
  .port[data-collapsed] .shead .lock .div, .port[data-collapsed] .shead .lock .gc { display:none; }
  .port[data-collapsed] .shead .lock .edc { height:15px; }
  .port[data-collapsed] .ssep { margin: 0 8px; }
  .port[data-collapsed] .mb.alerts .sw { display:none; }
  .port[data-collapsed] .mb:hover::before { content: attr(data-tip); position:fixed; transform: translate(40px, 0); padding:6px 12px; border-radius:6px; background: var(--g12); color: var(--g1); font-size:12px; font-weight:400; z-index:10; pointer-events:none; white-space:nowrap; }
</style>
</head>

    <span class="kbd-hint">⌘B · panel icon · sidebar edge</span>
  </div>
  <div class="label">Now</div>
  <div class="tile" id="t-now"></div>
  <div class="label">Port <span class="chip">shadcn sidebar</span></div>
  <div class="tile" id="t-port"></div>
  <div class="label">Port · inset <span class="chip">variant="inset"</span></div>
  <div class="tile" id="t-inset"></div>
</div>

    <div class="brand">${LOCK}</div>
    <nav class="views">${VIEWS.map(v => `<div class="ni${v.on?' on':''}">${I(v.icon)}<span>${v.label}</span><span class="nc">${v.n}</span>${v.dot?MSG:''}</div>`).join('')}
      <span class="sep"></span>${MORE.map(m => `<div class="ni">${I(m.icon)}<span>${m.label}</span></div>`).join('')}</nav>
    <span class="sp"></span>
    <div class="bell">${I('bell')}<span>Alerts</span><span class="sw"></span></div>
    <div class="me"><span class="av">DK</span><span class="mt"><span class="mn">Dana Kim</span><span class="mteam">GCHX Med Transpo</span></span>${I('down')}</div>
  </div><div class="main">
    <div class="top"><h1>All requests</h1><span class="cnt">13</span><span class="sp"></span><span class="ib">${I('search')}</span><span class="new">${I('plus')}New request<kbd>N</kbd></span><span class="ib">${I('bell')}</span></div>
    ${table()}
  </div></div>`;
}
function port() {
  const mb = (v) => `<div class="mb${v.on?' on':''}${v.dot?' pdot':''}" data-tip="${v.label}">${I(v.icon)}<span class="lbl">${v.label}</span>${v.dot?MSG:''}${v.n!=null?`<span class="badge">${v.n}</span>`:''}</div>`;
  return `<div class="desk"><aside class="side">
    <div class="shead"><div class="mb lg" data-tip="Is my friend in medical?">${LOCK}</div></div>
    <div class="scontent">
      <div class="group"><div class="menu">${VIEWS.map(mb).join('')}</div></div>
      <div class="ssep"></div>
      <div class="group" style="padding-top:0"><div class="menu">${MORE.map(mb).join('')}</div></div>
    </div>
    <div class="sfoot"><div class="menu">
      <div class="mb alerts" data-tip="Alerts on">${I('bell')}<span class="lbl">Alerts</span><span class="sw end"></span></div>
      <div class="mb lg" data-tip="Dana Kim"><span class="av">DK</span><span class="ut"><b>Dana Kim</b><span>GCHX Med Transpo</span></span>${I('updown','i end')}</div>
    </div></div>
    <button class="rail" aria-label="Toggle sidebar"></button>
  </aside><div class="main">
    <div class="top"><button class="gh trig" aria-label="Toggle sidebar">${I('panel')}</button><span class="vsep"></span><h1>All requests</h1><span class="cnt">13</span><span class="sp"></span><span class="gh">${I('search')}</span><span class="btn">${I('plus')}New request<kbd>N</kbd></span><span class="gh">${I('bell')}</span></div>
    ${table()}
  </div></div>`;
}
document.getElementById('t-now').innerHTML = now();
for (const [id, cls] of [['t-port','port flush'], ['t-inset','port inset']]) {
  const t = document.getElementById(id); t.className = 'tile ' + cls; t.innerHTML = port();
  t.querySelectorAll('.trig, .rail').forEach(b => b.addEventListener('click', () => t.toggleAttribute('data-collapsed')));
}
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); document.querySelectorAll('.tile.port').forEach(t => t.toggleAttribute('data-collapsed')); } });
document.querySelectorAll('#theme button').forEach(b => b.addEventListener('click', () => {
  document.getElementById('stage').dataset.theme = b.dataset.v;
  document.querySelectorAll('#theme button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
</script>
</body>
</html>
