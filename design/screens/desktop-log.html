<title>Desktop · Request log</title>

     Desk layout: sidebar views (All / Pending / My requests, Dashboard), the log as a table, and the request opening
     in a panel on the right so the list never goes away (Linear, GitHub, Attio pattern).
     Extra columns only where a desk has room: Post and Logged by. Keyboard: / search, N new request, J/K move,
     Enter open, Esc close. Real @radix-ui/themes 3.3.0 from CDN. Synthetic data only. -->

.radix-themes{--default-font-family:InterVariable,Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-feature-settings:"cv11";-webkit-font-smoothing:antialiased}
.radix-themes[data-is-root-theme]{min-height:0!important;height:100%;position:relative}
.board{display:flex;flex-direction:column;align-items:center;gap:28px;padding:24px}
.board figure{margin:0}
.frame{width:1440px;height:900px;border-radius:12px;overflow:hidden;border:1px solid #2b2b30}
figcaption{margin-top:10px;text-align:center;font:500 15px/1.3 system-ui;color:#e4e4e7}
figcaption span{display:block;font-weight:400;font-size:13px;color:#8e8e96;margin-top:2px}
.tab{font-variant-numeric:tabular-nums}
.sp{flex:1}
.win{height:100%;display:grid;grid-template-columns:232px 1fr;background:var(--color-background)}
.win.withPanel{grid-template-columns:232px 1fr 452px}
/* sidebar */
.side{display:flex;flex-direction:column;background:var(--gray-2);border-right:1px solid var(--gray-a4);padding:14px 10px}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 16px}
.brand .bt{font-size:13.5px;font-weight:600;color:var(--gray-12);letter-spacing:-.005em}
.mark{width:22px;height:22px;border-radius:6px;background:var(--gray-12);color:var(--gray-1);display:grid;place-items:center;font-size:12px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:1px}
.ni{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:7px;font-size:14px;color:var(--gray-11)}
.ni svg{color:var(--gray-10)}
.ni.on{background:var(--gray-a4);color:var(--gray-12);font-weight:500}.ni.on svg{color:var(--gray-12)}
.ni .c{margin-left:auto;font-size:12.5px;color:var(--gray-10)}
.sep{height:1px;background:var(--gray-a4);margin:10px 8px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--gray-12);color:var(--gray-1);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.me .tx{display:flex;flex-direction:column;min-width:0}
.me .n1{font-size:13.5px;font-weight:500;color:var(--gray-12)}.me .n2{font-size:12px;color:var(--gray-10)}
.bell{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;font-size:14px;color:var(--gray-11)}
.bell svg{color:var(--gray-10)}
.sw{margin-left:auto;width:28px;height:16px;border-radius:8px;background:var(--gray-12);position:relative}
.sw::after{content:"";position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--gray-1)}
/* main */
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 24px;border-bottom:1px solid var(--gray-a4)}
.top .h{font-size:17px;font-weight:600;color:var(--gray-12);letter-spacing:-.01em}
.top .hc{font-size:17px;color:var(--gray-9);margin-left:2px}
.search{display:flex;align-items:center;gap:8px;width:260px;height:32px;padding:0 8px 0 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--gray-a5);color:var(--gray-10);font-size:13.5px}
.kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:4px;font-size:11px;font-weight:500;color:var(--gray-10);box-shadow:inset 0 0 0 1px var(--gray-a5)}
.newb{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 12px;border-radius:8px;background:var(--gray-12);color:var(--gray-1);font-size:13.5px;font-weight:600}

.tbl{display:grid;grid-template-columns:64px minmax(140px,1fr) 170px 128px 96px 76px 150px;column-gap:12px;padding:0 20px 0 24px}
.withPanel .tbl{grid-template-columns:56px minmax(120px,1fr) 160px 96px 72px}
.th{height:34px;align-items:center;font-size:12px;font-weight:500;color:var(--gray-10);border-bottom:1px solid var(--gray-a4)}
.th .r,.tr .r{text-align:right}
.tr{height:44px;align-items:center;border-bottom:1px solid var(--gray-a3);font-size:14px;color:var(--gray-12)}
.tr.sel{background:var(--gray-a3);box-shadow:inset 2px 0 0 var(--gray-12)}
.tr .num{font-size:13px;font-weight:500;color:var(--gray-10)}
.tr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .nm small{font-size:12.5px;color:var(--gray-10);margin-left:8px}

.tr .cr{font-size:13px;color:var(--gray-11);text-align:right}
.tr .up{font-size:13px;color:var(--gray-9);text-align:right}

.fold{display:flex;align-items:center;gap:8px;height:44px;padding:0 20px 0 24px;border-bottom:1px solid var(--gray-a3);font-size:14px;font-weight:500;color:var(--gray-11)}
.cap{min-width:20px;height:20px;padding:0 7px;border-radius:999px;background:var(--gray-a3);color:var(--gray-11);font-size:12px;display:inline-grid;place-items:center}
.fold svg{color:var(--gray-10)}
/* panel */
.panel{border-left:1px solid var(--gray-a4);display:flex;flex-direction:column;min-width:0;background:var(--color-background)}
.ph{display:flex;align-items:center;gap:8px;height:56px;padding:0 14px 0 20px;border-bottom:1px solid var(--gray-a4)}
.ph .id{font-size:14px;font-weight:600;color:var(--gray-12)}
.ib{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--gray-11)}
.pb{flex:1;overflow:hidden;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;gap:14px;align-items:center}
.portrait{width:60px;height:74px;border-radius:8px;background:var(--gray-a5);color:var(--gray-11);display:grid;place-items:end center;overflow:hidden;flex:none}
.hero .n{font-size:22px;font-weight:600;letter-spacing:-.015em;color:var(--gray-12)}
.hero .m{font-size:13.5px;color:var(--gray-11);margin-top:3px}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--green-a3)}
.status .t1{font-size:14.5px;font-weight:500;color:var(--green-11)}.status .t2{font-size:12.5px;color:var(--gray-11);margin-top:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500}
.btn.soft{background:var(--gray-a3);color:var(--gray-12)}
.btn.solid{background:var(--gray-12);color:var(--gray-1)}
.lbl{font-size:12.5px;font-weight:500;color:var(--gray-10);margin-bottom:6px;display:flex;align-items:center}
.grp{border-radius:10px;box-shadow:inset 0 0 0 1px var(--gray-a4);overflow:hidden}
.kv{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:10px;min-height:40px;padding:0 12px;font-size:14px}
.kv+.kv{border-top:1px solid var(--gray-a3)}
.kv .k{color:var(--gray-10);font-size:13px}.kv .v{color:var(--gray-12)}
.phs{display:flex;gap:8px}
.pt{width:64px;height:64px;border-radius:8px;background:var(--gray-a5);color:var(--gray-11);display:grid;place-items:end center;overflow:hidden}
.pt.add{background:none;box-shadow:inset 0 0 0 1.5px var(--gray-a6);place-items:center;font-size:12px;color:var(--gray-10)}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:flex;gap:10px;padding-bottom:12px}
.tl li:not(:last-child)::before{content:"";position:absolute;left:6px;top:16px;bottom:0;width:1.5px;background:var(--gray-a5)}
.tl .tt{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--gray-12)}
.tl .ts{font-size:12px;color:var(--gray-10)}
.menu{position:absolute;z-index:10;width:250px;padding:5px;border-radius:10px;background:var(--color-panel-solid);box-shadow:var(--shadow-5)}
.mi{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;font-size:14px;color:var(--gray-12)}
.mi.hl{background:var(--gray-a3)}
</style>
