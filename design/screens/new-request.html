<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft v2 · New request</title>
<!-- Draft v2 2026-11-06. Rule: the whole form fits on one phone screen without scrolling. Two groups,
     one row pattern. Anything less common sits behind "More details", and helpers appear only when relevant.
     Reporting location is the first, full-width row so it can't be missed (Brian). The privacy line is removed (Brian).
     Real @radix-ui/themes 3.3.0 components, loaded from CDN (needs internet). Synthetic data only. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@radix-ui/themes@3.3.0/styles.css">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
html.standalone{background:#0c0c0d}html.standalone body{margin:0;padding:16px}
.radix-themes{--default-font-family:InterVariable,Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-feature-settings:"cv11";-webkit-font-smoothing:antialiased}
.radix-themes[data-is-root-theme]{min-height:0!important;height:100%;position:relative}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px 16px;max-width:760px}
.board figure{margin:0}.frame{height:760px;border-radius:30px;overflow:hidden;border:1px solid #2b2b30}
figcaption{margin-top:8px;text-align:center;font:12px/1.3 system-ui;color:#8e8e96}
.app{height:100%;display:flex;flex-direction:column;position:relative}
.form.scrolled>*{transform:translateY(-262px)}
.k.wide{width:104px}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px 6px}
.nav>:first-child{justify-self:start}.nav>:last-child{justify-self:end}
.form{flex:1;overflow:hidden;padding:0 14px 100px;display:flex;flex-direction:column}
.form>*{flex-shrink:0}
.lbl{padding:11px 4px 6px}
.grp{border-radius:var(--radius-4);background:var(--gray-a2);box-shadow:inset 0 0 0 1px var(--gray-a4);overflow:hidden}
.grp>*+*{border-top:1px solid var(--gray-a4)}
.r{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 14px}
.r.top{align-items:flex-start}.r.top .k{padding-top:13px}
.k{width:74px;flex:none;font-size:14px;color:var(--gray-11)}
.in{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--gray-12);font:inherit;font-size:16px;padding:11px 0;-webkit-appearance:none}
.in::placeholder{color:var(--gray-9)}
.in.age{flex:0 0 52px}
.vr{width:1px;align-self:stretch;background:var(--gray-a4);margin:0 2px}
textarea.in{resize:none;line-height:1.35;padding:12px 0 10px}
.focus{box-shadow:inset 0 0 0 1.5px var(--gray-a8);border-radius:var(--radius-4)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 12px 14px}
.sp{flex:1}
.thumbs{display:flex;gap:6px;align-items:center}
.th{width:30px;height:30px;border-radius:var(--radius-2);background:var(--gray-a5);color:var(--gray-11);display:grid;place-items:end center;overflow:hidden}
.loc{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;margin-top:6px;border-radius:var(--radius-4);background:var(--gray-a3)}
.loc .pin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gray-12);color:var(--gray-1);flex:none}
.loc .lv{display:flex;flex-direction:column;gap:1px}
.pcard{display:flex}
.pc{flex:1;min-width:0}
.pc>*+*{border-top:1px solid var(--gray-a4)}
.slot{flex:none;width:76px;height:104px;margin:14px 0 14px 14px;align-self:center;border-radius:var(--radius-3);display:grid;place-items:center;color:var(--gray-11);box-shadow:inset 0 0 0 1.5px var(--gray-a6);position:relative;overflow:hidden}
.slot.has{background:var(--gray-a5);box-shadow:none;place-items:end center}
.slot .cnt{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gray-12);color:var(--gray-1);font-size:10px;font-weight:600;display:grid;place-items:center}
.slot .when{position:absolute;left:4px;right:4px;bottom:4px;border-radius:4px;background:var(--black-a9);color:#fff;font-size:9.5px;font-weight:500;text-align:center;line-height:15px}
.foot-note{display:flex;gap:6px;align-items:center;padding:8px 4px 0;color:var(--gray-10);font-size:12px}
.more{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 12px 0 14px;margin-top:10px;border-radius:var(--radius-4);color:var(--gray-11);box-shadow:inset 0 0 0 1px var(--gray-a4)}
.foot{position:absolute;left:0;right:0;bottom:0;padding:12px 14px 26px;background:var(--color-background);box-shadow:0 -1px 0 var(--gray-a4);z-index:3}
.off{display:flex;align-items:center;gap:8px;margin:2px 14px 4px;padding:9px 12px;border-radius:var(--radius-3);background:var(--amber-a3);color:var(--amber-11);font-size:13px;font-weight:500}
</style>
<script type="importmap">{"imports":{
"react":"https://esm.sh/react@18.3.1",
"react-dom":"https://esm.sh/react-dom@18.3.1",
"react-dom/client":"https://esm.sh/react-dom@18.3.1/client",
"@radix-ui/themes":"https://esm.sh/@radix-ui/themes@3.3.0?deps=react@18.3.1,react-dom@18.3.1",
"htm":"https://esm.sh/htm@3.1.1"}}</script>
</head><body><div id="b"></div>
<script type="module">
import React from 'react';
import { flushSync } from 'react-dom';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
import { Theme, Text, Button, SegmentedControl } from '@radix-ui/themes';
if (location.protocol === 'file:' || location.protocol.startsWith('http')) document.documentElement.classList.add('standalone');
const h = htm.bind(React.createElement);
const svg = (p, s = 16) => h`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style=${{ flex: 'none' }} dangerouslySetInnerHTML=${{ __html: p }} />`;
const P = {
  pin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  chevUp: '<path d="m18 15-6-6-6 6"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  plus: '<path d="M5 12h14M12 5v14"/>',
  cam: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  bust: '<circle cx="12" cy="10" r="5"/><path d="M2 26a10 9 0 0 1 20 0"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  cloudOff: '<path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/><path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"/>',
};
// Shown only while "Last seen" has focus. Stage names come from the site plan.
const PLACES = ['kineticFIELD', 'circuitGROUNDS', 'neonGARDEN', 'stereoBLOOM', 'Taken to medical'];
// Behind "More details". Every field from Jeffrey's form is still here.
const MORE = [['hair', 'Hair'], ['height_build', 'Build', 'Height, build'], ['identifying_features', 'Features', 'Tattoos, piercings, glasses'], ['physical_description', 'Description'], ['contact_notes', 'Contact notes'], ['additional_notes', 'Other notes']];

const Lbl = ({ children }) => h`<${Text} as="div" size="2" weight="medium" color="gray" className="lbl">${children}<//>`;
const Row = ({ k, top, wide, cls = '', children }) => h`<div className=${'r ' + (top ? 'top ' : '') + cls}><span className=${'k' + (wide ? ' wide' : '')}>${k}</span>${children}</div>`;
const Inp = ({ v, ph, mode, type, cls = '' }) => h`<input className=${'in ' + cls} defaultValue=${v || ''} placeholder=${ph} inputMode=${mode} type=${type || 'text'} autoComplete="off"/>`;

function NewRequest({ dark, d = {}, more, focus, offline }) {
  const any = Object.values(d).some(Boolean);
  return h`<${Theme} appearance=${dark ? 'dark' : 'light'} accentColor="gray" grayColor="gray" radius="medium"><div className="app">
    <div className="nav">
      <${Button} variant="ghost" color="gray" size="2">Cancel<//>
      <${Text} size="3" weight="medium">New request<//>
      <span></span>
    </div>
    ${offline ? h`<div className="off" role="status">${svg(P.cloudOff, 16)}Offline · 1 waiting to send</div>` : null}
    <div className=${'form' + (more ? ' scrolled' : '')}>
      <div className="loc" role="button" aria-label="Reporting from FA 3, Kinetic. Change">
        <span className="pin">${svg(P.pin, 18)}</span>
        <div className="lv"><${Text} size="1" color="gray">Reporting from<//><${Text} size="3" weight="medium">FA 3 – Kinetic<//></div>
        <span className="sp"></span><span style=${{ color: 'var(--gray-10)', display: 'flex' }}>${svg(P.chev, 18)}</span>
      </div>
      <${Lbl}>Missing person<//>
      <div className="grp">
        <div className="pcard">
          <div className=${'slot' + (d.photos ? ' has' : '')} role="button" aria-label=${d.photos ? `${d.photos} photos, taken today. Add or change` : 'Add photo'}>
            ${d.photos ? h`${svg(P.bust, 70)}<span className="cnt">${d.photos}</span><span className="when">Today</span>` : svg(P.cam, 20)}
          </div>
          <div className="pc">
            <div className="r"><${Inp} v=${d.name} ph="Name or initials, e.g. J.D."/></div>
            <div className="r"><${Inp} v=${d.age} ph="Age" mode="numeric"/></div>
            <div className="r"><${SegmentedControl.Root} size="1" defaultValue=${d.gender || ''} aria-label="Gender" style=${{ width: '100%' }}>
                <${SegmentedControl.Item} value="Male">Male<//><${SegmentedControl.Item} value="Female">Female<//><${SegmentedControl.Item} value="Other">Other<//>
              <//></div>
          </div>
        </div>
        <${Row} k="Wearing" top><textarea className="in" rows="2" defaultValue=${d.clothing || ''} placeholder="Clothing, colors, accessories"></textarea><//>
        <div className=${focus ? 'focus' : ''}>
          <${Row} k="Last seen"><${Inp} v=${d.last_seen} ph="Where, roughly when"/><//>
          ${focus ? h`<div className="sugg">${PLACES.map((p) => h`<${Button} key=${p} size="1" variant="soft" color="gray" radius="full">${p}<//>`)}</div>` : null}
        </div>
      </div>
      <${Lbl}>Friend or family<//>
      <div className="grp">
        <${Row} k="Name"><${Inp} v=${d.c_name} ph="Who's looking"/><//>
        <${Row} k="Phone"><${Inp} v=${d.c_phone} ph="Phone number" type="tel" mode="tel"/>${d.c_phone ? h`<span style=${{ color: 'var(--green-10)', display: 'flex' }} aria-label="Valid number">${svg(P.check, 16)}</span>` : null}<//>
        <${Row} k="Relation"><${Inp} v=${d.c_rel} ph="Friend, partner, sibling…"/><//>
      </div>
      ${more ? h`
        <${Lbl}>More details<//>
        <div className="grp">${MORE.map(([key, k, ph]) => h`<${Row} key=${key} k=${k} wide><${Inp} v=${d[key]} ph=${ph || ''}/><//>`)}</div>`
        : h`<div className="more" role="button" aria-expanded="false"><${Text} size="2">More details<//><span className="sp"></span>${svg(P.chev, 16)}</div>`}
    </div>
    <div className="foot"><${Button} size="3" highContrast disabled=${!any} style=${{ width: '100%' }}>${offline ? h`${svg(P.cloudOff, 16)}Save offline` : 'Send request'}<//></div>
  </div><//>`;
}

const FILLED = {
  name: 'Kayla Martinez', age: '19', gender: 'Female',
  clothing: 'Pink cowboy hat, silver fringe top, white shorts', last_seen: 'kineticFIELD rail, ~10:30', photos: 2,
  c_name: 'Maya R.', c_phone: '(407) 555-0142', c_rel: 'Best friend',
};
const Board = () => h`<div className="board">
  <figure><div className="frame"><${NewRequest} dark/></div><figcaption>Open · the whole form on one screen</figcaption></figure>
  <figure><div className="frame"><${NewRequest} d=${FILLED}/></div><figcaption>Filled · photo sits in the person card, ✓ on a real number</figcaption></figure>
  <figure><div className="frame"><${NewRequest} dark d=${{ name: 'T.R.', age: '24', gender: 'Male', clothing: 'Red hoodie, green wristband' }} focus/></div><figcaption>Typing "Last seen" · stage shortcuts appear</figcaption></figure>
  <figure><div className="frame"><${NewRequest} d=${{ ...FILLED, hair: 'Blond, two braids' }} more/></div><figcaption>More details opened · the only time it scrolls</figcaption></figure>
</div>`;
flushSync(() => createRoot(document.getElementById('b')).render(h`<${Board}/>`));
</script></body></html>
