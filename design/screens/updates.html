<title>Updates + On my way</title>
<!-- v7 (Brian): iMessage-style thread + composer — solid bubbles, "Delivered" / "Read 4:14 PM" in words under my latest
     message (no tick icons), a rounded field with the send arrow inside, softer suggestion pills. Build with Radix
     TextArea (autosize) + IconButton. v6 (Brian): all anyone needs is "Friend en route" — no names or teams; the action is "En route".
     v5 (Brian): the On the way pill says what is happening in words, nicely formatted: "Dana K. is on the way" + "~4 min".
     v4 (Fable re-judge): pill = avatar + walk + countdown ("4 min", amber "late"), state-driven chips, WhatsApp tick
     colours (blue ✓✓ = seen), one small time under the latest message, glyph-only empty state, desktop parity.
     v3 (Brian): messages only — no system lines, no timestamps; empty state; cards use graphics (avatar + time for On the way,
     a message button with an unread count) instead of sentences. v2 after the Fable UX review: On my way is a state (On the way → Arrived → cleared by Reunited), shown as system lines
     and a status row, absolute ETA, unread dots everywhere, delivery ticks, chips 40 px. 2026-11-06 ~16:40. Brian: staff still relay "this pt is being worked up, only bring one" / "ok on my way with them" in
     WhatsApp. Give each request a dispatch-style narrative (CAD call notes: one timestamped line per entry, who + team),
     one-tap optional quick lines, an OPTIONAL "On my way" with optional ETA (Active911 "Responding"), and seen-by receipts
     (hospital "acknowledged"). Everything optional; free text allowed. Synthetic data. -->

.arow .t1{font-size:15px;font-weight:600;color:var(--gray-12)}.arow .t2{font-size:14.5px;color:var(--gray-11);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .w{font-size:12px;color:var(--gray-10);align-self:flex-start;margin-top:13px}.arow .u{position:absolute;left:8px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--gray-12)}
.arow.read .t1{font-weight:400;color:var(--gray-11)}.arow.read .t2{color:var(--gray-10)}
.dt2{display:grid;grid-template-columns:64px minmax(140px,1fr) 270px 160px 90px 150px;padding:0 24px;height:48px;align-items:center;border-bottom:1px solid var(--gray-a3);font-size:14.5px;color:var(--gray-12)}
.dt2.h{height:40px;font-size:13px;color:var(--gray-11)}.dt2 .n{color:var(--gray-11)}.dt2 .as{font-size:13.5px;color:var(--gray-11);margin-left:6px}
.dt2 .r{text-align:right}.dt2.closed{color:var(--gray-10)}

/* recheck board (Brian 18:05): Not found holds as pending for a recheck before it closes */
.later{display:flex;align-items:center;gap:8px;padding:16px 4px 6px;font-size:13px;font-weight:600;color:var(--gray-11)}
.later .c{min-width:20px;height:20px;border-radius:999px;background:var(--gray-a4);display:grid;place-items:center;font-size:12px}
.later .rule{flex:1;height:1px;background:var(--gray-a4)}
.crow{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-radius:12px;background:var(--gray-a2);box-shadow:inset 0 0 0 1px var(--gray-a3);font-size:15px;color:var(--gray-11)}
.crow .at{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--gray-11)}
.rc{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;background:var(--blue-a4);color:var(--blue-11);font-size:12.5px;font-weight:600;white-space:nowrap}
.hold{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;background:var(--gray-a4);color:var(--gray-12);font-size:12.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.status.gray{background:var(--gray-a3)}.status.gray .t1{color:var(--gray-12)}.status.gray .lr{border-top-color:var(--gray-a4)}.status.gray .lr svg{color:var(--gray-11)}

/* colours board (Brian 18:10): colour = meaning, plus one subtext per status */
.st.violet{color:var(--violet-11)}.st.teal{color:var(--teal-11)}.st.orange{color:var(--orange-11)}.st.cyan{color:var(--cyan-11)}
.lg{padding:22px 18px;display:flex;flex-direction:column;gap:2px}
.lg .gh{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-10);padding:14px 2px 6px}
.lg .it{display:grid;grid-template-columns:22px 1fr;column-gap:10px;align-items:center;padding:7px 2px}
.lg .it .l{font-size:16px;font-weight:600}.lg .it .s{grid-column:2;font-size:13.5px;color:var(--gray-11);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.lg .sw2{width:22px;display:grid;place-items:center}
.chipc{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;font-size:12.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.status.violet{background:var(--violet-a3)}.status.violet .t1{color:var(--violet-11)}.status.violet .lr{border-top-color:var(--violet-a4)}.status.violet .lr svg{color:var(--violet-11)}
.enr.teal{background:var(--teal-a3);color:var(--teal-11)}
.opt{padding:14px 0 0}.opt .oh{padding:0 16px 6px;font-size:13px;font-weight:600;color:var(--gray-11)}
</style>
<script type="importmap">{"imports":{
"react":"https://esm.sh/react@18.3.1","react-dom":"https://esm.sh/react-dom@18.3.1","react-dom/client":"https://esm.sh/react-dom@18.3.1/client",
"@radix-ui/themes":"https://esm.sh/@radix-ui/themes@3.3.0?deps=react@18.3.1,react-dom@18.3.1","htm":"https://esm.sh/htm@3.1.1"}}</script>
</head><body><img id="appicon" src="../../public/icons/icon-192.png" hidden alt=""><div id="b"></div>
<script type="module">
import React from 'react';
import { flushSync } from 'react-dom';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
import { Theme } from '@radix-ui/themes';
const h = htm.bind(React.createElement);
const svg = (p, s = 16, w = 1.75) => h`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${w} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style=${{ flex: 'none' }} dangerouslySetInnerHTML=${{ __html: p }} />`;
const P = {
  x: '<path d="M18 6 6 18M6 6l12 12"/>', dots: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  pin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  flag: '<path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"/>',
  walk: '<circle cx="13" cy="4" r="2"/><path d="m7 21 2-6 3 3v3"/><path d="m9 12 2-4 3 2 3 1"/><path d="M11 8 8 9 6 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', checks: '<path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/>', send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  bust: '<circle cx="12" cy="10" r="5"/><path d="M2 26a10 9 0 0 1 20 0"/>', chev: '<path d="m6 9 6 6 6-6"/>',
};
const pie = (f) => { const a = f * 2 * Math.PI, x = 7 + 3.25 * Math.sin(a), y = 7 - 3.25 * Math.cos(a); return `M7 7L7 3.75A3.25 3.25 0 ${f > 0.5 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z`; };
const gIn = (s = 14) => h`<svg width=${s} height=${s} viewBox="0 0 14 14" style=${{ flex: 'none' }}><circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--green-9)" strokeWidth="1.5"/><path d=${pie(0.75)} fill="var(--green-9)"/></svg>`;
const Shell = ({ children }) => h`<${Theme} appearance="dark" accentColor="gray" grayColor="gray" radius="medium"><div className="app">${children}</div><//>`;

// Messages: a chat thread that belongs to the request. Events are small centred lines; people are bubbles.
const Thread = ({ me = 'Dana', empty }) => empty ? h`<div className="chat"><div className="empty" aria-label="No messages yet">${svg('<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>', 30, 1.5)}</div></div>` : me === 'Dana' ? h`<div className="chat">
  <span className="from"><b>Rae C.</b> · Medical</span>
  <div className="bub them">Being worked up</div>
  <div className="bub them">Bring 1 person only</div>
  <div className="gap"></div>
  <div className="bub me">Got it, just me and the friend</div>
  <span className="rcpt"><b>Read</b> 4:14 PM</span>
</div>` : h`<div className="chat">
  <div className="bub me">Being worked up</div>
  <div className="bub me">Bring 1 person only</div>
  <span className="rcpt">Delivered</span>
  <span className="from"><b>Dana K.</b> · Transpo</span>
  <div className="bub them">Got it, just me and the friend</div>
</div>`;
const Composer = ({ side = 'med', state = 'on', typing }) => h`<div className="composer">
  <div className="chips">${(side === 'med' ? ['Bring 1 person only', 'Being worked up — wait', 'Ready for them'] : state === 'on' ? ['Arrived', "Can't find them"] : ['En route', "Can't find them"]).map((c) => h`<span key=${c} className="chip">${c === 'Arrived' ? svg(P.check, 15, 2) : c === 'En route' ? svg(P.walk, 15, 2) : null}${c}</span>`)}</div>
  <div className="field2">${typing ? h`<span>On our way now</span><span className="cur"></span>` : h`<span className="ph">Message</span>`}<span className=${'sendb' + (typing ? '' : ' off')}>${svg('<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>', 17, 2.5)}</span></div>
</div>`;

const Request = () => h`<${Shell}>
  <div className="nav"><span className="cb">${svg(P.x, 18)}</span><span style=${{ color: 'var(--gray-11)', fontSize: 16 }}>LP-0004</span><span className="cb">${svg(P.dots, 18)}</span></div>
  <div className="hero"><div className="photo">${svg(P.bust, 44)}</div><div><div className="nm">A.L.</div><div className="as">21 · Female · FA 4 – Oasis</div></div></div>
  <div className="status"><div className="top">${gIn(18)}<div><div className="t1">In medical · friend coming</div><div className="t2">Rae C. · 4:09 PM</div></div></div><div className="lr">${svg(P.pin, 16, 2)}Chair 14</div><div className="enr">${svg(P.walk, 18, 2)}Friend en route<span className="m">~4 min</span></div></div>
  <div className="sec">Messages</div>
  <${Thread} me="Dana"/>
  <${Composer} side="foh" typing/>
<//>`;

const Mine = ({ cancelled, pressed }) => h`<${Shell}>
  <div className="lt"><span className="tx">My requests</span><span className="tc">3</span></div>
  <div className="list">
    <div className="card"><div className="l1"><span className="nm">A.L.</span><span className="as">21 F</span><span className="wait">${gIn()}</span></div>
      <div className="row2"><span className="loc">${svg(P.pin, 14, 2)}Chair 14</span></div>
      ${cancelled ? null : h`<div className=${'enr' + (pressed ? ' pr' : '')}>${svg(P.walk, 18, 2)}Friend en route<span className="m">~4 min</span>${svg('<path d="m9 18 6-6-6-6"/>', 16, 2.25)}</div>`}
      <div className="two">${cancelled ? h`<span className="btn outline">${svg(P.walk, 16, 2)}En route</span>` : h`<span className="btn outline">${svg(P.check, 16, 2)}Arrived</span>`}<span className="btn outline mbtn">${svg('<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>', 16)}Message<span className="badge">1</span></span></div>
    </div>
    <div className="card"><div className="l1"><span className="nm">R.P.</span><span className="as">30 M</span><span className="wait">${gIn()}</span></div>
      <div className="row2"><span className="loc">${svg(P.pin, 14, 2)}Bed 3</span></div>
      <div className="two"><span className="btn outline">${svg(P.walk, 16, 2)}En route</span><span className="btn outline">${svg('<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>', 16)}Message</span></div>
    </div>
  </div>
<//>`;

const OnMyWay = () => h`<${Shell}><${Mine}/>
  <div className="scrim"></div>
  <div className="sheet"><div className="handle"></div>
    <div className="sh">Friend en route</div>
    <div className="etas" aria-label="ETA, optional">${['Now', '~5 min', '~10 min', '~15 min'].map((e) => h`<span key=${e} className="eta">${e}</span>`)}</div>
    <div className="two"><span className="btn outline">Cancel</span><span className="btn solid">${svg(P.walk, 16, 2)}Send</span></div>
  </div>
<//>`;

const Coming = () => h`<${Shell}>
  <div className="lt"><span className="tx">Pending</span><span className="tc">5</span></div>
  <div className="seg"><span>To check 3</span><span className="on">Friend coming 2<span className="udot"></span></span></div>
  <div className="list">
    <div className="card"><div className="l1"><span className="nm">A.L.</span><span className="as">21 F</span><span className="wait">7m</span></div>
      <div className="row2"><span className="loc">${svg(P.pin, 14, 2)}Chair 14</span><span className="to">→ Chris P. · boyfriend</span></div>
      <div className="enr">${svg(P.walk, 18, 2)}Friend en route<span className="m">~4 min</span></div>
      <div className="two"><span className="btn outline mbtn">${svg('<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>', 16)}Message<span className="badge">1</span></span><span className="btn solid">${svg(P.check, 16, 2.25)}Reunited</span></div></div>
    <div className="card"><div className="l1"><span className="nm">R.P.</span><span className="as">30 M</span><span className="wait">2m</span></div>
      <div className="row2"><span className="loc" style=${{ background: 'none', boxShadow: 'inset 0 0 0 1px var(--gray-a6)', color: 'var(--gray-11)', fontWeight: 500 }}>+ Location</span></div>
      <div className="to">→ Alex M. · partner</div>
      <div className="two"><span className="btn outline">${svg('<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>', 16)}Message</span><span className="btn solid">${svg(P.check, 16, 2.25)}Reunited</span></div></div>
  </div>
<//>`;

const Empty = () => h`<${Shell}>
  <div className="nav"><span className="cb">${svg(P.x, 18)}</span><span style=${{ color: 'var(--gray-11)', fontSize: 16 }}>LP-0007</span><span className="cb">${svg(P.dots, 18)}</span></div>
  <div className="hero"><div><div className="nm">R.P.</div><div className="as">30 · Male · Base</div></div></div>
  <div className="status"><div className="top">${gIn(18)}<div><div className="t1">In medical · friend coming</div><div className="t2">Rae C. · 4:21 PM</div></div></div><div className="lr">${svg(P.pin, 16, 2)}Bed 3</div></div>
  <div className="sec">Messages</div><${Thread} empty/>
  <${Composer} side="foh" state="none"/>
<//>`;

const Desk = () => h`<${Theme} appearance="dark" accentColor="gray" grayColor="gray" radius="medium"><div className="dwin">
  <aside className="side"></aside>
  <main><div className="dtop">Pending<span style=${{ color: 'var(--gray-9)', fontWeight: 400 }}>5</span></div>
    <div className="dt dth"><span>#</span><span>Friend</span><span>Status</span><span></span><span style=${{ textAlign: 'right' }}>Created</span></div>
    ${[['0004', 'A.L.', 'In medical · Chair 14', '4:02 PM', true], ['0007', 'R.P.', 'In medical · Bed 3', '3:55 PM'], ['0012', 'J.D.', 'Waiting for check', '4:11 PM']].map(([n, nm, s, t, sel]) => h`<div key=${n} className=${'dt' + (sel ? ' sel' : '')}><span style=${{ color: 'var(--gray-10)', fontSize: 13 }}>${n}</span><span style=${{ display: 'flex', alignItems: 'center', minWidth: 0 }}>${nm}${sel ? h`<span className="rowbadge">1</span>` : null}</span><span style=${{ color: s.startsWith('In') ? 'var(--green-11)' : 'var(--blue-11)', fontSize: 13, whiteSpace: 'nowrap' }}>${s}</span><span>${sel ? h`<span className="otw2" style=${{ height: 26, fontSize: 13, paddingLeft: 9 }}>${svg(P.walk, 13, 2)}Friend en route · ~4 min</span>` : null}</span><span style=${{ textAlign: 'right', color: 'var(--gray-11)', fontSize: 13 }}>${t}</span></div>`)}
  </main>
  <section className="pane"><div className="app" style=${{ background: 'none' }}>
    <div className="hero" style=${{ paddingTop: 16 }}><div className="photo">${svg(P.bust, 44)}</div><div><div className="nm">A.L.</div><div className="as">21 · Female · FA 4 – Oasis</div></div></div>
    <div className="status"><div className="top">${gIn(18)}<div><div className="t1">In medical · friend coming</div><div className="t2">Rae C. · 4:09 PM</div></div></div><div className="lr">${svg(P.pin, 16, 2)}Chair 14</div><div className="enr">${svg(P.walk, 18, 2)}Friend en route<span className="m">~4 min</span></div></div>
    <div className="sec">Messages</div><${Thread} me="Rae"/>
    <${Composer} side="med"/>
  </div></section>
</div><//>`;


// ---- clarify board ----------------------------------------------------------------------------
const Q = { help: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.3-2.4 2.3"/><path d="M12 16.5h.01"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', msg: '<path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/>',
  bust: '<circle cx="12" cy="10" r="5"/><path d="M2 26a10 9 0 0 1 20 0"/>', search: '<circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/>', zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>' };
const gW = (s = 14) => h`<svg width=${s} height=${s} viewBox="0 0 14 14" style=${{ flex: 'none' }}><circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--blue-9)" strokeWidth="1.5"/></svg>`;
const gQ = (s = 14) => h`<svg width=${s} height=${s} viewBox="0 0 14 14" style=${{ flex: 'none' }}><circle cx="7" cy="7" r="5.75" fill="none" stroke="var(--amber-9)" strokeWidth="1.5"/><text x="7" y="9.9" textAnchor="middle" fontSize="8" fontWeight="700" fill="var(--amber-9)" fontFamily="Inter,system-ui">?</text></svg>`;
const gNF = (s = 14) => h`<svg width=${s} height=${s} viewBox="0 0 14 14" style=${{ flex: 'none' }}><circle cx="7" cy="7" r="6.25" fill="var(--gray-8)"/><path d="M5 5l4 4M9 5l-4 4" stroke="var(--color-background)" strokeWidth="1.6" strokeLinecap="round"/></svg>`;
const gDone = (s = 14) => h`<svg width=${s} height=${s} viewBox="0 0 14 14" style=${{ flex: 'none' }}><circle cx="7" cy="7" r="6.25" fill="var(--gray-8)"/><path d="M4.4 7.2l1.8 1.8 3.5-3.7" fill="none" stroke="var(--color-background)" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>`;
const gEn = (s = 14, c = 'var(--blue-11)') => h`<span style=${{ color: c, display: 'flex' }}>${svg(P.walk, s + 1, 2)}</span>`;
const gArr = (s = 14) => h`<span style=${{ color: 'var(--green-11)', display: 'flex' }}>${svg(P.check, s + 1, 2.4)}</span>`;
const STAGE = {
  waiting: { g: gW, t: 'Waiting for check', c: 'blue' }, need: { g: gQ, t: 'Needs info', c: 'amber' }, inmed: { g: (s) => gIn(s), t: 'In medical', c: 'green' },
  enroute: { g: gEn, t: 'Friend en route', c: 'blue' }, arrived: { g: gArr, t: 'Friend arrived', c: 'green' },
  notfound: { g: gNF, t: 'Not found in medical', c: 'gray' }, reunited: { g: gDone, t: 'Reunited', c: 'gray' }, discharged: { g: gDone, t: 'Discharged', c: 'gray' }, cancelled: { g: gNF, t: 'Cancelled', c: 'gray' },
};
const Stage = ({ k, extra, s = 14 }) => { const m = STAGE[k]; return h`<span className=${'st ' + m.c}>${m.g(s)}${m.t}${extra ? h`<span style=${{ fontVariantNumeric: 'tabular-nums' }}>${extra}</span>` : null}</span>`; };

const Ladder = () => h`<${Shell}><div className="ladder">
  <div style=${{ fontSize: 22, fontWeight: 700, color: 'var(--gray-12)', marginBottom: 14 }}>Statuses</div>
  ${[['waiting'], ['need', 1], ['inmed'], ['enroute', 1], ['arrived', 1], ['reunited']].map(([k, auto], i) => h`<div key=${k} className="step"><${Stage} k=${k} s=${18}/>${auto ? h`<span className="au">${svg(Q.zap, 13, 2)}auto</span>` : null}</div>`)}
  <div className="exits">${['notfound', 'discharged', 'cancelled'].map((k) => h`<div key=${k}><${Stage} k=${k} s=${18}/></div>`)}</div>
</div><//>`;

const ROWS = [['0014', 'E.N.', 'waiting', null, '4:31 PM'], ['0013', 'K.T.', 'need', null, '4:16 PM'], ['0012', 'J.D.', 'waiting', null, '4:11 PM'], ['0011', 'R.P.', 'inmed', null, '4:05 PM'], ['0010', 'A.L.', 'enroute', null, '4:00 PM'], ['0009', 'M.P.', 'arrived', null, '3:30 PM']];
const CLOSED = [['0007', 'B.W.', 'notfound', '3:12 PM'], ['0006', 'S.O.', 'reunited', '2:58 PM'], ['0004', 'T.N.', 'discharged', '2:40 PM']];
const AllList = () => h`<${Shell}>
  <div className="lt"><span className="tx">All requests</span><span className="tc">9</span></div>
  ${ROWS.map(([n, nm, k, x, t]) => h`<div key=${n} className="lrow"><span className="n">${n}</span><span>${nm}</span><${Stage} k=${k}/><span className="t">${t}</span></div>`)}
  <div className="arch">Archived<span className="c">3</span><span className="sp"></span>${svg(P.chev, 16, 2)}</div>
  ${CLOSED.map(([n, nm, k, t]) => h`<div key=${n} className="lrow closed"><span className="n">${n}</span><span>${nm}</span><${Stage} k=${k}/><span className="t">${t}</span></div>`)}
<//>`;

const MsgBtn = ({ n }) => h`<span className="ibx" aria-label=${n ? `Messages, ${n} unread` : 'Messages'}>${svg(Q.msg, 18)}${n ? h`<span className="badge">${n}</span>` : null}</span>`;
const ToCheckCard = ({ nm, as, m, heat, d, meta, need, prev, unread, photo }) => h`<div className="card">
  <div style=${{ display: 'flex', gap: 12 }}>${photo ? h`<div className="photo" style=${{ width: 60, height: 72 }}>${svg(Q.bust, 48)}</div>` : null}
    <div style=${{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 4 }}>
      <div className="l1"><span className="nm">${nm}</span><span className="as">${as}</span><span className="wait" style=${{ display: 'flex', alignItems: 'center', gap: 4, color: heat || 'var(--gray-11)' }}>${svg(Q.clock, 13, 2)}${m}m</span></div>
